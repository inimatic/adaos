name: Bootstrap release kit
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: [AdaOS nightly regression]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bootstrap-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false
jobs:
  build-kit:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: linux-x86_64-gnu
            runner: ubuntu-24.04
          - profile: linux-aarch64-gnu
            runner: ubuntu-24.04-arm
          - profile: windows-x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact platform kit and run managed offline admission
        shell: bash
        run: python tools/build_bootstrap_release.py --profile '${{ matrix.profile }}' --output .tmp/bootstrap-release --release "$(git rev-parse HEAD)" --revision "$(git rev-parse HEAD)"
      - name: Retain exact kit for regional publication
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.profile }}-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            .tmp/bootstrap-release/*-${{ matrix.profile }}.tar.gz
            .tmp/bootstrap-release/release.json
            .tmp/bootstrap-release/bootstrap-distribution.*
          if-no-files-found: error
          retention-days: 14
