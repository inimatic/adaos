name: AdaOS CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs-stable/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  pull_request:
    paths-ignore:
      - "docs-stable/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick_tests:
    name: Fast SDK checks (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.adaos/build/y-py-target
      PYTHONIOENCODING: utf-8
      MONOREPO_URL: ${{ secrets.ADAOS_MONOREPO_URL || 'https://github.com/inimatic/adaoskills.git' }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GIT_AUTHOR_NAME: "AdaOS CI Bot"
      GIT_AUTHOR_EMAIL: "ci-bot@example.com"
      GIT_COMMITTER_NAME: "AdaOS CI Bot"
      GIT_COMMITTER_EMAIL: "ci-bot@example.com"
      ADAOS_TESTING: "1"
    steps:
      - name: Force UTF-8 on Linux
        run: |
          export PYTHONUTF8=1
          export PYTHONIOENCODING=utf-8

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust 1.72
        uses: dtolnay/rust-toolchain@1.72.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project + dev deps
        run: |
          uv sync --locked --extra dev

      - name: Run fast SDK checks
        run: |
          uv run python -m pytest \
            -q \
            --strict-markers \
            -o importmode=importlib \
            --junitxml=reports/sdk-fast-junit.xml \
            tests/sdk \
            tests/smoke \
            tests/test_ci_core_version_bump.py \
            tests/test_tests_cli.py \
            tests/test_realtime_sidecar.py \
            tests/test_root_mcp_output_profile.py \
            tests/test_supervisor.py \
            tests/test_yjs_gateway_phase1.py::test_gateway_transport_snapshot_does_not_retain_live_ydoc_on_worker \
            tests/test_yjs_gateway_phase1.py::test_gateway_transport_snapshot_hands_room_introspection_to_owner_thread

      - name: Enforce bounded MCP collections and output budgets
        run: |
          uv run python tools/mcp_output_profiler.py \
            --sample \
            --ci \
            --output .tmp/ci-mcp-output-profile.json

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ubuntu-latest-py3.11-sdk-fast
          path: reports/*.xml
          retention-days: 3

  skills_tests:
    name: Skills tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.adaos/build/y-py-target
      PYTHONIOENCODING: utf-8
      MONOREPO_URL: ${{ secrets.ADAOS_MONOREPO_URL || 'https://github.com/inimatic/adaoskills.git' }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GIT_AUTHOR_NAME: "AdaOS CI Bot"
      GIT_AUTHOR_EMAIL: "ci-bot@example.com"
      GIT_COMMITTER_NAME: "AdaOS CI Bot"
      GIT_COMMITTER_EMAIL: "ci-bot@example.com"
      ADAOS_TESTING: "1"
    steps:
      - name: Force UTF-8 on Linux
        run: |
          export PYTHONUTF8=1
          export PYTHONIOENCODING=utf-8

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate pinned AdaOS client revision
        shell: bash
        run: |
          client_path="src/adaos/integrations/adaos-client"
          client_revision="$(git ls-tree HEAD "$client_path" | awk '{print $3}')"
          expected_revision="$(tr -d '[:space:]' < "${client_path}.sha")"
          if [ "$client_revision" != "$expected_revision" ]; then
            echo "::error file=${client_path}.sha::Client revision mismatch: gitlink=${client_revision}, expected=${expected_revision}. Update the gitlink and .sha together."
            exit 1
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust 1.72
        uses: dtolnay/rust-toolchain@1.72.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project + dev deps
        run: |
          uv sync --locked --extra dev

      - name: Run skills tests
        run: |
          uv run adaos tests run --only-skills -- -q --junitxml=reports/skills-junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ubuntu-latest-py3.11-skills
          path: reports/*.xml
          retention-days: 3

  builder_contracts:
    name: Builder context, delivery and usability contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      ADAOS_TESTING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@1.72.0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Checkout pinned Client contract consumer
        run: git submodule update --init --depth 1 src/adaos/integrations/adaos-client
      - name: Check generated component contracts
        run: uv run python scripts/generate_ui_component_contract.py --check
      - name: Install locked Client dependencies
        working-directory: src/adaos/integrations/adaos-client
        run: npm ci
      - name: Check Client contract inventory, boundaries and types
        working-directory: src/adaos/integrations/adaos-client
        run: |
          npm run test:boundaries
          npx tsc --noEmit -p tsconfig.app.json
      - name: Check Builder contracts without providers or external services
        run: |
          uv run python -m pytest -q --strict-markers -o importmode=importlib \
            --junitxml=reports/builder-contracts.xml \
            tests/test_ui_component_contracts.py \
            tests/test_contract_context_admission.py \
            tests/test_component_contract_reference.py \
            tests/test_component_matched_evolution.py \
            tests/test_component_contract_mcp.py \
            tests/test_builder_contract_usage.py \
            tests/test_component_contract_ci.py \
            tests/test_context_control.py \
            tests/test_prototype_resource_workbench.py \
            tests/test_builder_semantic_prototype.py \
            tests/test_builder_semantic_admission.py \
            tests/test_builder_semantic_proposer.py \
            tests/test_builder_prototype_task_context.py \
            tests/test_builder_prototype_pipeline.py \
            tests/test_builder_prototype_context_ablation.py \
            tests/test_e2e_composition_metrics.py \
            tests/test_e2e_dollar_budget.py \
            tests/test_llm_client.py \
            tests/test_llm_wait_phase_timing.py \
            tests/test_e2e_blind_ux.py \
            tests/test_e2e_png_transport.py \
            tests/test_materialization_runtime.py \
            tests/test_webspace_component_state.py \
            tests/test_builder_preview_sdk.py \
            tests/test_builder_workbench.py \
            tests/test_yjs_bootstrap.py \
            tests/test_yjs_native_lifetime.py \
            tests/test_pending_action_projection.py \
            tests/test_pending_action_websocket_offload.py \
            tests/test_sqlite_readonly_snapshot.py \
            tests/test_sqlite_store.py \
            tests/test_prototype_task_acceptance.py \
            tests/test_retained_context_qualification.py \
            tests/test_webspace_phase2.py::test_prepare_materialization_external_sources_tolerates_legacy_resolution \
            tests/test_webspace_phase2.py::test_desktop_launcher_includes_only_trials_selected_for_target_webspace \
            tests/test_webspace_phase2.py::test_phase5_derived_readiness_includes_sequential_catalog_preparation
      - name: Install locked browser-test dependencies
        working-directory: e2e/stand/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check public usability acceptance helpers
        run: >-
          node --test e2e/stand/browser/prototype-usability.test.mjs
          e2e/stand/browser/component-contract-write-proof.test.mjs
          e2e/stand/browser/prototype-validation-guard.test.mjs
          e2e/stand/browser/prototype-procurement-fields.test.mjs
          e2e/stand/browser/prototype-procurement-basic.test.mjs
          e2e/stand/browser/prototype-selection-effect.test.mjs
      - name: Upload contract receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-context-delivery-usability-contracts
          path: reports/builder-contracts.xml
          retention-days: 7

  bump_patch_version:
    name: Bump patch version
    needs: [quick_tests, skills_tests, builder_contracts]
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !startsWith(github.event.head_commit.message, 'chore: bump adaos version')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check branch head
        id: head
        shell: bash
        run: |
          set -euo pipefail
          skip=false
          expected="${GITHUB_SHA}"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Branch moved from ${expected} to ${actual}; skipping stale bump."
            skip=true
          fi
          message="$(git log -1 --format=%s)"
          if [[ "$message" == chore:\ bump\ adaos\ version* ]]; then
            echo "Latest commit is already an AdaOS version bump; skipping."
            skip=true
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.head.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        if: steps.head.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Bump pyproject patch version
        if: steps.head.outputs.skip != 'true'
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          old_version="$(python tools/bump_adaos_patch_version.py --current)"
          new_version="$(python tools/bump_adaos_patch_version.py)"
          uv lock
          echo "old_version=${old_version}" >> "$GITHUB_OUTPUT"
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "Bumped AdaOS ${old_version} -> ${new_version}"

      - name: Commit version bump
        if: steps.head.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pyproject.toml uv.lock; then
            echo "No version change to commit."
            exit 0
          fi
          git config user.name "AdaOS CI Bot"
          git config user.email "ci-bot@example.com"
          git add pyproject.toml uv.lock
          git commit -m "chore: bump adaos version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push origin HEAD:main
