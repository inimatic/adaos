name: AdaOS CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs-stable/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  pull_request:
    paths-ignore:
      - "docs-stable/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick_tests:
    name: Fast SDK checks (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.adaos/build/y-py-target
      PYTHONIOENCODING: utf-8
      MONOREPO_URL: ${{ secrets.ADAOS_MONOREPO_URL || 'https://github.com/inimatic/adaoskills.git' }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GIT_AUTHOR_NAME: "AdaOS CI Bot"
      GIT_AUTHOR_EMAIL: "ci-bot@example.com"
      GIT_COMMITTER_NAME: "AdaOS CI Bot"
      GIT_COMMITTER_EMAIL: "ci-bot@example.com"
      ADAOS_TESTING: "1"
    steps:
      - name: Force UTF-8 on Linux
        run: |
          export PYTHONUTF8=1
          export PYTHONIOENCODING=utf-8

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust 1.72
        uses: dtolnay/rust-toolchain@1.72.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project + dev deps
        run: |
          uv sync --locked --extra dev

      - name: Run fast SDK checks
        run: |
          uv run python -m pytest \
            -q \
            --strict-markers \
            -o importmode=importlib \
            --junitxml=reports/sdk-fast-junit.xml \
            tests/sdk \
            tests/smoke \
            tests/test_ci_core_version_bump.py \
            tests/test_tests_cli.py \
            tests/test_realtime_sidecar.py \
            tests/test_root_mcp_output_profile.py \
            tests/test_supervisor.py \
            tests/test_yjs_gateway_phase1.py::test_gateway_transport_snapshot_does_not_retain_live_ydoc_on_worker \
            tests/test_yjs_gateway_phase1.py::test_gateway_transport_snapshot_hands_room_introspection_to_owner_thread

      - name: Enforce bounded MCP collections and output budgets
        run: |
          uv run python tools/mcp_output_profiler.py \
            --sample \
            --ci \
            --output .tmp/ci-mcp-output-profile.json

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ubuntu-latest-py3.11-sdk-fast
          path: reports/*.xml
          retention-days: 3

  skills_tests:
    name: Skills tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.adaos/build/y-py-target
      PYTHONIOENCODING: utf-8
      MONOREPO_URL: ${{ secrets.ADAOS_MONOREPO_URL || 'https://github.com/inimatic/adaoskills.git' }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GIT_AUTHOR_NAME: "AdaOS CI Bot"
      GIT_AUTHOR_EMAIL: "ci-bot@example.com"
      GIT_COMMITTER_NAME: "AdaOS CI Bot"
      GIT_COMMITTER_EMAIL: "ci-bot@example.com"
      ADAOS_TESTING: "1"
    steps:
      - name: Force UTF-8 on Linux
        run: |
          export PYTHONUTF8=1
          export PYTHONIOENCODING=utf-8

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate pinned AdaOS client revision
        shell: bash
        run: |
          client_path="src/adaos/integrations/adaos-client"
          client_revision="$(git ls-tree HEAD "$client_path" | awk '{print $3}')"
          expected_revision="$(tr -d '[:space:]' < "${client_path}.sha")"
          if [ "$client_revision" != "$expected_revision" ]; then
            echo "::error file=${client_path}.sha::Client revision mismatch: gitlink=${client_revision}, expected=${expected_revision}. Update the gitlink and .sha together."
            exit 1
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust 1.72
        uses: dtolnay/rust-toolchain@1.72.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project + dev deps
        run: |
          uv sync --locked --extra dev

      - name: Run skills tests
        run: |
          uv run adaos tests run --only-skills -- -q --junitxml=reports/skills-junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ubuntu-latest-py3.11-skills
          path: reports/*.xml
          retention-days: 3

  bump_patch_version:
    name: Bump patch version
    needs: [quick_tests, skills_tests]
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !startsWith(github.event.head_commit.message, 'chore: bump adaos version')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check branch head
        id: head
        shell: bash
        run: |
          set -euo pipefail
          skip=false
          expected="${GITHUB_SHA}"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Branch moved from ${expected} to ${actual}; skipping stale bump."
            skip=true
          fi
          message="$(git log -1 --format=%s)"
          if [[ "$message" == chore:\ bump\ adaos\ version* ]]; then
            echo "Latest commit is already an AdaOS version bump; skipping."
            skip=true
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.head.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        if: steps.head.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Bump pyproject patch version
        if: steps.head.outputs.skip != 'true'
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          old_version="$(python tools/bump_adaos_patch_version.py --current)"
          new_version="$(python tools/bump_adaos_patch_version.py)"
          uv lock
          echo "old_version=${old_version}" >> "$GITHUB_OUTPUT"
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "Bumped AdaOS ${old_version} -> ${new_version}"

      - name: Commit version bump
        if: steps.head.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pyproject.toml uv.lock; then
            echo "No version change to commit."
            exit 0
          fi
          git config user.name "AdaOS CI Bot"
          git config user.email "ci-bot@example.com"
          git add pyproject.toml uv.lock
          git commit -m "chore: bump adaos version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push origin HEAD:main
