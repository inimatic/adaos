name: AdaOS CI

on:
  push:
    # Keep the rollout branch until installers, backend webhooks, and active slots
    # have been migrated to the repository default branch together.
    branches: [rev2026]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  workflow_dispatch:
    inputs:
      include_windows:
        description: "Also run Windows CI"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk_tests:
    name: SDK tests (Ubuntu ${{ matrix.label }}/6)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            label: 1
          - shard: 1
            label: 2
          - shard: 2
            label: 3
          - shard: 3
            label: 4
          - shard: 4
            label: 5
          - shard: 5
            label: 6
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.adaos/build/y-py-target
      PYTHONIOENCODING: utf-8
      MONOREPO_URL: ${{ secrets.ADAOS_MONOREPO_URL || 'https://github.com/inimatic/adaoskills.git' }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GIT_AUTHOR_NAME: "AdaOS CI Bot"
      GIT_AUTHOR_EMAIL: "ci-bot@example.com"
      GIT_COMMITTER_NAME: "AdaOS CI Bot"
      GIT_COMMITTER_EMAIL: "ci-bot@example.com"
      ADAOS_TESTING: "1"
    steps:
      - name: Force UTF-8 on Linux
        run: |
          export PYTHONUTF8=1
          export PYTHONIOENCODING=utf-8

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust 1.72
        uses: dtolnay/rust-toolchain@1.72.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project + dev deps
        run: |
          uv sync --locked --extra dev

      - name: Run SDK test shard
        run: |
          uv run python tools/ci_sdk_shard.py \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 6 \
            --junitxml "reports/sdk-junit-${{ matrix.shard }}.xml" \
            -- -q

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ubuntu-latest-py3.11-sdk-${{ matrix.shard }}
          path: reports/*.xml
          retention-days: 3

  skills_tests:
    name: Skills tests (Ubuntu)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.adaos/build/y-py-target
      PYTHONIOENCODING: utf-8
      MONOREPO_URL: ${{ secrets.ADAOS_MONOREPO_URL || 'https://github.com/inimatic/adaoskills.git' }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GIT_AUTHOR_NAME: "AdaOS CI Bot"
      GIT_AUTHOR_EMAIL: "ci-bot@example.com"
      GIT_COMMITTER_NAME: "AdaOS CI Bot"
      GIT_COMMITTER_EMAIL: "ci-bot@example.com"
      ADAOS_TESTING: "1"
    steps:
      - name: Force UTF-8 on Linux
        run: |
          export PYTHONUTF8=1
          export PYTHONIOENCODING=utf-8

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust 1.72
        uses: dtolnay/rust-toolchain@1.72.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project + dev deps
        run: |
          uv sync --locked --extra dev

      - name: Run skills tests
        run: |
          uv run adaos tests run --only-skills -- -q --junitxml=reports/skills-junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ubuntu-latest-py3.11-skills
          path: reports/*.xml
          retention-days: 3

  windows_nightly:
    name: Python tests (Windows nightly)
    if: >-
      ${{
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.include_windows)
      }}
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.adaos/build/y-py-target
      PYTHONIOENCODING: utf-8
      MONOREPO_URL: ${{ secrets.ADAOS_MONOREPO_URL || 'https://github.com/inimatic/adaoskills.git' }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GIT_AUTHOR_NAME: "AdaOS CI Bot"
      GIT_AUTHOR_EMAIL: "ci-bot@example.com"
      GIT_COMMITTER_NAME: "AdaOS CI Bot"
      GIT_COMMITTER_EMAIL: "ci-bot@example.com"
      ADAOS_TESTING: "1"
    steps:
      - name: Force UTF-8 on Windows
        shell: pwsh
        run: |
          chcp.com 65001 > $null
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $PSDefaultParameterValues['Out-File:Encoding'] = 'utf8'
          $env:PYTHONUTF8=1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust 1.72
        uses: dtolnay/rust-toolchain@1.72.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project + dev deps
        run: |
          uv sync --locked --extra dev

      - name: Run SDK tests (only)
        run: |
          uv run adaos tests run --only-sdk -- --junitxml=reports/sdk-junit.xml -q

      - name: Run skills tests
        run: |
          uv run adaos tests run --only-skills -- -q --junitxml=reports/skills-junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-windows-latest-py3.11
          path: reports/*.xml
          retention-days: 3

  bump_patch_version:
    name: Bump patch version
    needs: [sdk_tests, skills_tests]
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/rev2026' &&
        !startsWith(github.event.head_commit.message, 'chore: bump adaos version')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout rev2026
        uses: actions/checkout@v4
        with:
          ref: rev2026
          fetch-depth: 0

      - name: Check branch head
        id: head
        shell: bash
        run: |
          set -euo pipefail
          skip=false
          expected="${GITHUB_SHA}"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Branch moved from ${expected} to ${actual}; skipping stale bump."
            skip=true
          fi
          message="$(git log -1 --format=%s)"
          if [[ "$message" == chore:\ bump\ adaos\ version* ]]; then
            echo "Latest commit is already an AdaOS version bump; skipping."
            skip=true
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.head.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        if: steps.head.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Bump pyproject patch version
        if: steps.head.outputs.skip != 'true'
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          old_version="$(python tools/bump_adaos_patch_version.py --current)"
          new_version="$(python tools/bump_adaos_patch_version.py)"
          uv lock
          echo "old_version=${old_version}" >> "$GITHUB_OUTPUT"
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "Bumped AdaOS ${old_version} -> ${new_version}"

      - name: Commit version bump
        if: steps.head.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pyproject.toml uv.lock; then
            echo "No version change to commit."
            exit 0
          fi
          git config user.name "AdaOS CI Bot"
          git config user.email "ci-bot@example.com"
          git add pyproject.toml uv.lock
          git commit -m "chore: bump adaos version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push origin HEAD:rev2026
