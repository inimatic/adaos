name: Rasa port release wheel

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable inimatic/rasa-port commit or tag
        required: true
        default: 7352542dcb3b484d7787ec70447d9240e83ce092
        type: string
      release_tag:
        description: Existing rasa-port release tag
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable rasa-port source
        uses: actions/checkout@v4
        with:
          repository: inimatic/rasa-port
          ref: ${{ inputs.source_ref }}
          path: rasa-port
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Build and contract-test universal wheel
        shell: bash
        run: |
          python -m pip install build pytest
          python -m build --wheel --outdir dist rasa-port
          (cd rasa-port && python -m pytest -q tests_contract)
          test "$(find dist -maxdepth 1 -name 'adaos_rasa_nlu-*-py3-none-any.whl' | wc -l)" = 1
          sha256sum dist/*.whl | tee dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: rasa-port-wheel
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error

  install-contract:
    needs: build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - uses: actions/download-artifact@v4
        with:
          name: rasa-port-wheel
          path: dist
      - name: Verify wheel can be installed without Git
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "import adaos_rasa_nlu, rasa; print(adaos_rasa_nlu.__file__, rasa.__file__)"

