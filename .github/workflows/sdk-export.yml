# .github/workflows/sdk-export.yml
name: SDK Export

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.adaos/build/y-py-target
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Rust 1.72
        uses: dtolnay/rust-toolchain@1.72.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Show Python
        shell: bash
        run: |
          python --version
          which python || where python

      - name: Install deps
        run: uv sync --locked --extra dev

      - name: Run SDK tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ADAOS_TESTING: 1
          MONOREPO_URL: https://github.com/inimatic/adaoskills.git
        run: |
          uv run adaos tests run --only-sdk -- --junitxml=reports/sdk-junit.xml -q

      - name: Run SDK tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ADAOS_TESTING: 1
          MONOREPO_URL: https://github.com/inimatic/adaoskills.git
        run: |
          uv run adaos tests run --only-sdk -- --junitxml=reports/sdk-junit.xml -q
