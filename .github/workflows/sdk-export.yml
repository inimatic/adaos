# .github/workflows/sdk-export.yml
name: SDK Export

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.adaos/build/y-py-target
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Rust 1.72
        uses: dtolnay/rust-toolchain@1.72.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Show Python
        shell: bash
        run: |
          python --version
          which python || where python

      - name: Install deps
        run: uv sync --locked --extra dev

      - name: Run bounded metadata contract tests
        env:
          ADAOS_TESTING: 1
          MONOREPO_URL: https://github.com/inimatic/adaoskills.git
        run: |
          uv run pytest tests/test_exporter_descriptions.py tests/test_root_mcp_output_profile.py tests/test_ui_capabilities.py tests/test_device_access.py tests/test_device_inventory.py --junitxml=reports/sdk-junit.xml -q

      - name: Enforce MCP output budgets
        run: uv run python tools/mcp_output_profiler.py --ci

      - name: Build canonical SDK metadata
        run: uv run python tools/build_sdk_metadata.py

      - name: Upload SDK metadata
        uses: actions/upload-artifact@v4
        with:
          name: adaos-sdk-metadata-${{ runner.os }}-py${{ matrix.python-version }}
          path: build/sdk-metadata/adaos-sdk-metadata.json
          retention-days: 7
