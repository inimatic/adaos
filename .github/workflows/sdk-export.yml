# .github/workflows/sdk-export.yml
name: SDK Export

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Show Python
        shell: bash
        run: |
          python --version
          which python || where python

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Run SDK tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ADAOS_TESTING: 1
          MONOREPO_URL: https://github.com/inimatic/adaoskills.git
        run: |
          adaos tests run --only-sdk -- --junitxml=reports/sdk-junit.xml -q

      - name: Run SDK tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ADAOS_TESTING: 1
          MONOREPO_URL: https://github.com/inimatic/adaoskills.git
        run: |
          adaos tests run --only-sdk -- --junitxml=reports/sdk-junit.xml -q
