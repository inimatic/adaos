name: y-py fork wheels

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing y-py tag to receive the built wheels
        required: false
        type: string
  push:
    tags:
      - "y-py-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/adaos-y-py-target
        with:
          command: build
          args: >-
            --release
            --out dist
            --manifest-path vendor/y-py/Cargo.toml
            --interpreter python3.11
          manylinux: auto

      - name: Test built wheel
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install --no-index --find-links dist "y-py==0.6.2+adaos.1"
          python -m pytest -q vendor/y-py/tests

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: y-py-wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: Publish wheel assets
    if: startsWith(github.ref, 'refs/tags/y-py-v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes "AdaOS y-py fork wheels built from vendor/y-py."
          fi
          gh release upload "$RELEASE_TAG" dist/*.whl --clobber
