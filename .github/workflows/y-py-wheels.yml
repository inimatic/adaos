name: y-py fork wheels

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing y-py tag to receive the built wheels
        required: false
        type: string
  push:
    tags:
      - "y-py-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build wheel (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            machine: x86_64
            asset: y_py-0.6.2+adaos.1-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          - os: windows-latest
            label: windows-x86_64
            machine: AMD64
            asset: y_py-0.6.2+adaos.1-cp311-cp311-win_amd64.whl
          - os: macos-15
            label: macos-arm64
            machine: arm64
            asset: y_py-0.6.2+adaos.1-cp311-cp311-macosx_11_0_arm64.whl
          - os: macos-15-intel
            label: macos-x86_64
            machine: x86_64
            asset: y_py-0.6.2+adaos.1-cp311-cp311-macosx_11_0_x86_64.whl
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify runner architecture
        shell: bash
        run: |
          python -c "import platform; actual=platform.machine(); expected='${{ matrix.machine }}'; assert actual.lower() == expected.lower(), f'{actual} != {expected}'"

      - name: Configure macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/adaos-y-py-target
        with:
          command: build
          args: >-
            --release
            --out dist
            --manifest-path vendor/y-py/Cargo.toml
            --interpreter python3.11
          manylinux: auto

      - name: Verify wheel filename
        shell: bash
        run: test -f "dist/${{ matrix.asset }}"

      - name: Test built wheel
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install --no-index --find-links dist "y-py==0.6.2+adaos.1"
          python -m pytest -q vendor/y-py/tests

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: y-py-wheel-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: Publish wheel assets
    if: startsWith(github.ref, 'refs/tags/y-py-v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes "AdaOS y-py fork wheels built from vendor/y-py."
          fi
          gh release upload "$RELEASE_TAG" dist/*.whl --clobber
