schema: adaos.builder.e2e_case.v1
case_id: equipment-inspections-ru
title: Осмотр оборудования
description: Видимый пример повторяемой формы, вложений и жизненного цикла проверки.
locale: ru
tags: [visible, inspection, form]
requirements:
  primary_jobs:
    - statement: начать осмотр
      acceptance: Можно выбрать объект и начать или открыть связанный с ним осмотр.
    - statement: заполнить пункты проверки
      acceptance: Повторяемые пункты имеют редактируемый результат, измерение и комментарий.
      exclusions: [Отдельный пошаговый мастер не обязателен.]
    - statement: приложить фотографию дефекта
      acceptance: Доступен поддерживаемый ввод вложения или ссылки на фотографию с сохранением на целевом пункте.
    - statement: сохранить незавершенный осмотр
      acceptance: Исполняемое сохранение результатов не требует завершения осмотра.
    - statement: завершить осмотр
      acceptance: Доступен переход к завершенному состоянию. Для завершения отдельного пункта его собственный дефект требует комментария через декларативную проверку поля или guard. Если завершается осмотр, а дефекты хранятся в связанных пунктах, проверка всех пунктов допустимо отложена до Automation только с доступным примером дефекта без комментария, явным предупреждением об отсутствии проверки и сохраненным тестом отклонения завершения.
      exclusions: [Поддерживаемую проверку полей одной записи нельзя отложить как внешнюю интеграцию., Не требовать дублировать результаты связанных пунктов в записи осмотра или вводить отдельное завершение каждого пункта ради обхода ограничения прототипа.]
  representative_states:
    - statement: без назначенных осмотров
      acceptance: Есть отображаемое пустое состояние списка осмотров.
    - statement: незавершенный осмотр
      acceptance: Видны незавершенные данные осмотра.
    - statement: есть дефект
      acceptance: Есть доступный пример пункта с дефектом и его комментарием или измерением.
prohibited_assumptions:
  - statement: дефект можно завершить без комментария
    acceptance: Применять только к завершению, не к сохранению черновика. Завершение отдельного дефектного пункта требует локальной проверки его комментария. Для завершения осмотра с межзаписочной проверкой принять либо исполняемую проверку всех связанных пунктов, либо доступный пример нарушения вместе с явным отложенным требованием Automation и тестом запрета завершения. Молчаливый пропуск проверки, голый capability gap или утверждение о безопасности такого завершения недопустимы.
steps:
  - id: create
    type: builder.chat
    input:
      text: Создай новое приложение "Осмотр оборудования ${case_instance_id}" для выездного техника.
      auto_apply: true
      owns_created_draft: true
    expect:
      values: {ok: true, project_status: ready}
      paths_present: [session_id, scenario_id, project_ref, artifact_root, draft_id]
  - id: design
    type: builder.chat
    input:
      text: Сделай рабочую первую версию. Техник выбирает объект, проходит повторяемый список проверок, отмечает результат каждого пункта, добавляет измерение, комментарий и фотографию дефекта, сохраняет незавершенный осмотр и затем завершает его. Покажи правдоподобные данные, состояние без назначенных осмотров и запрети завершение дефекта без комментария.
      auto_apply: true
    expect:
      values: {ok: true}
      values_in: {status: [llm_pending, applied]}
  - id: wait
    type: builder.wait
    input: {session_id: $steps.create.session_id, job_id: $steps.design.llm_job.job_id}
    expect: {values: {ok: true, status: succeeded}}
  - id: validate
    type: scenario.validate
    input: {scenario_id: $steps.create.scenario_id}
    expect: {values: {ok: true}}
  - id: grade
    type: prototype.grade
    input: {scenario_id: $steps.create.scenario_id, threshold: 0.85}
    expect: {values: {ok: true, passed: true}}
cleanup: {policy: always, retain_on_failure: true}
