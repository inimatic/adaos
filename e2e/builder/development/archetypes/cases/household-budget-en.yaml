schema: adaos.builder.e2e_case.v1
case_id: household-budget-en
title: Household budget
description: Visible development case for money, computed values, and period comparison.
locale: en
tags: [visible, finance, dashboard]
requirements:
  primary_jobs:
    - statement: record transaction
      acceptance: An accessible editor saves income or expense with date, category, person, amount, currency and note.
    - statement: review balance and category totals
      acceptance: Visible balance and per-category totals use representative data. If not computed, they disclose the simulation and preserve the pending calculation requirement for Automation.
      exclusions: [Live aggregation is not a Prototype requirement; static totals must not be claimed as computed.]
    - statement: compare this month with the previous month
      acceptance: Both months' labeled amounts can be inspected and compared, including their currency.
      exclusions: [Charts, percentage calculations and a dedicated comparison screen are optional.]
    - statement: set monthly category limits
      acceptance: A working editor can save limits associated with a month and category.
    - statement: see exceeded limits
      acceptance: A visible over-limit example and pending Automation calculation obligation suffice when the limit comparison is not computed.
  representative_states:
    - statement: new month
      acceptance: An empty new-month state is explicitly renderable.
    - statement: within budget
      acceptance: A visible category fixture illustrates spending within its monthly limit.
    - statement: over budget
      acceptance: A visible category fixture clearly identifies spending above its limit.
prohibited_assumptions:
  - statement: currency can be omitted
    acceptance: Monetary values requested by the user need visible currency context; a shared currency label is sufficient.
  - statement: simulated totals are presented as live computed totals
    acceptance: Disclosed fixtures with a pending calculation obligation are allowed at Prototype stage. A claim of live computation without a matching implementation is a violation.
steps:
  - id: create
    type: builder.chat
    input:
      text: Create a new application named "Household Budget ${case_instance_id}" for two people managing shared monthly spending.
      auto_apply: true
      owns_created_draft: true
    expect:
      values: {ok: true, project_status: ready}
      paths_present: [session_id, scenario_id, project_ref, artifact_root, draft_id]
  - id: design
    type: builder.chat
    input:
      text: Make the first version usable now. We need to record income and expenses with date, category, person, amount, currency and note; see the current balance and category totals; compare this month with the previous month; set monthly category limits; and clearly see when a limit is exceeded. Use realistic sample data and include an empty new-month state.
      auto_apply: true
    expect:
      values: {ok: true}
      values_in: {status: [llm_pending, applied]}
  - id: wait
    type: builder.wait
    input: {session_id: $steps.create.session_id, job_id: $steps.design.llm_job.job_id}
    expect: {values: {ok: true, status: succeeded}}
  - id: validate
    type: scenario.validate
    input: {scenario_id: $steps.create.scenario_id}
    expect: {values: {ok: true}}
  - id: grade
    type: prototype.grade
    input: {scenario_id: $steps.create.scenario_id, threshold: 0.85}
    expect: {values: {ok: true, passed: true}}
cleanup: {policy: always, retain_on_failure: true}
