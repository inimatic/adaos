schema: adaos.builder.e2e_case.v1
case_id: inventory-procurement-ru
title: Запасы и закупки
description: Видимый пример остатков, поставщиков, цен и согласования закупки.
locale: ru
tags: [visible, inventory, approval]
requirements:
  primary_jobs:
    - statement: найти дефицит и отфильтровать по категории
      acceptance: Видны позиции ниже минимума, их количество и единицы; работает фильтр категории. Иллюстративные расчеты должны быть отделены от исполняемых.
    - statement: открыть историю движения
      acceptance: У выбранной позиции доступна связанная история приходов или расходов.
    - statement: подготовить заявку на закупку
      acceptance: Исполняемое создание или редактирование сохраняет выбранные позиции и количество заявки.
    - statement: сравнить поставщиков
      acceptance: Можно сопоставить предложения нескольких поставщиков по цене, валюте и сроку.
      exclusions: [Автоматический выбор победителя и отдельная сравнительная матрица не обязательны.]
    - statement: отправить заявку на согласование
      acceptance: Исполняемое действие переводит выбранную заявку в ожидание решения. Для внешнего согласования допустим явный pending Automation контракт.
      exclusions: [Пользователь не просил реализовать принятие решения другим пользователем или систему ролей.]
  representative_states:
    - statement: ниже минимума
      acceptance: Есть видимая позиция с недостаточным остатком.
    - statement: пустой список дефицита
      acceptance: Доступно отображаемое состояние без дефицитных позиций.
    - statement: ожидает согласования
      acceptance: Видна заявка в ожидании решения.
prohibited_assumptions: []
steps:
  - id: create
    type: builder.chat
    input:
      text: Создай новое приложение "Запасы и закупки ${case_instance_id}" для небольшой мастерской.
      auto_apply: true
      owns_created_draft: true
    expect:
      values: {ok: true, project_status: ready}
      paths_present: [session_id, scenario_id, project_ref, artifact_root, draft_id]
  - id: design
    type: builder.chat
    input:
      text: Сделай пригодную для работы первую версию. Нужно быстро видеть позиции ниже минимального остатка, фильтровать их по категории, открывать историю движения, собирать заявку на закупку, сравнивать цены и сроки нескольких поставщиков и отправлять заявку на согласование. Добавь реалистичные данные, валюту и единицы измерения, пустой список дефицита и состояние ожидания решения.
      auto_apply: true
    expect:
      values: {ok: true}
      values_in: {status: [llm_pending, applied]}
  - id: wait
    type: builder.wait
    input: {session_id: $steps.create.session_id, job_id: $steps.design.llm_job.job_id}
    expect: {values: {ok: true, status: succeeded}}
  - id: validate
    type: scenario.validate
    input: {scenario_id: $steps.create.scenario_id}
    expect: {values: {ok: true}}
  - id: grade
    type: prototype.grade
    input: {scenario_id: $steps.create.scenario_id, threshold: 0.85}
    expect: {values: {ok: true, passed: true}}
cleanup: {policy: always, retain_on_failure: true}
