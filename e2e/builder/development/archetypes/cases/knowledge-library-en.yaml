schema: adaos.builder.e2e_case.v1
case_id: knowledge-library-en
title: Team knowledge library
description: Visible development case for search, facets, documents, and detail continuity.
locale: en
tags: [visible, knowledge, search]
requirements:
  primary_jobs:
    - statement: find article
      acceptance: Working word search and topic, owner and status filters expose matching articles.
    - statement: inspect details
      acceptance: Selecting an article reveals its formatted content and attachments while retaining the search surface or state.
      exclusions: [Every attachment format need not have an embedded preview.]
    - statement: add article
      acceptance: A create action saves a draft from entered article values.
    - statement: revise and publish article
      acceptance: An existing draft can be edited, saved and changed to published with executable actions.
  representative_states:
    - statement: empty library
      acceptance: An empty-library state is renderable.
    - statement: search results
      acceptance: Matching article fixtures are accessible through the search surface.
    - statement: no results
      acceptance: A query can show no matching records with a visible empty-results message.
    - statement: archived read-only article
      acceptance: An archived article is visibly inspectable without an enabled mutation path for that article.
prohibited_assumptions:
  - statement: archived content is editable
    acceptance: An executable mutation path for an archived article violates the requested read-only state. Editing an active draft is unrelated.
steps:
  - id: create
    type: builder.chat
    input:
      text: Create a new application named "Team Library ${case_instance_id}" for internal how-to articles and reference files.
      auto_apply: true
      owns_created_draft: true
    expect:
      values: {ok: true, project_status: ready}
      paths_present: [session_id, scenario_id, project_ref, artifact_root, draft_id]
  - id: design
    type: builder.chat
    input:
      text: Produce a useful first version now. People need to search by words, filter by topic, owner and status, scan matching articles, open an article without losing their search, read its formatted content and attachments, create a draft and revise it before publishing. Include realistic examples plus empty-library, no-results, and archived read-only article states.
      auto_apply: true
    expect:
      values: {ok: true}
      values_in: {status: [llm_pending, applied]}
  - id: wait
    type: builder.wait
    input: {session_id: $steps.create.session_id, job_id: $steps.design.llm_job.job_id}
    expect: {values: {ok: true, status: succeeded}}
  - id: validate
    type: scenario.validate
    input: {scenario_id: $steps.create.scenario_id}
    expect: {values: {ok: true}}
  - id: grade
    type: prototype.grade
    input: {scenario_id: $steps.create.scenario_id, threshold: 0.85}
    expect: {values: {ok: true, passed: true}}
cleanup: {policy: always, retain_on_failure: true}
