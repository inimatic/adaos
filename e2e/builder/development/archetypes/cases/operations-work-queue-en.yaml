schema: adaos.builder.e2e_case.v1
case_id: operations-work-queue-en
title: Operations work queue
description: Visible development case for a dense operational queue and detail workflow.
locale: en
tags: [visible, operations, master-detail]
requirements:
  primary_jobs:
    - statement: triage work
      acceptance: Visible work items expose status, priority, owner and due date for scanning.
      exclusions: [A board, dashboard or automatic prioritization is not required.]
    - statement: inspect details
      acceptance: Select an item and see its details while the queue remains available.
    - statement: add a request
      acceptance: A create action consumes values from an accessible editor.
    - statement: assign ownership
      acceptance: An edit or assignment action saves the chosen owner on the target item.
    - statement: change status
      acceptance: A working action or editor can set New, In progress, Blocked and Done.
      exclusions: [Confirmation of status changes was not requested.]
  representative_states:
    - statement: empty
      acceptance: An explicit empty-queue surface is renderable.
    - statement: populated
      acceptance: Realistic work fixtures are visible in the queue.
    - statement: overdue
      acceptance: A visible item illustrates an overdue state; a live clock or automatic escalation is not required at Prototype stage.
prohibited_assumptions: []
steps:
  - id: create
    type: builder.chat
    input:
      text: Create a new application named "Operations Queue ${case_instance_id}" for a small support team that tracks incoming work.
      auto_apply: true
      owns_created_draft: true
    expect:
      values: {ok: true, project_status: ready}
      paths_present: [session_id, scenario_id, project_ref, artifact_root, draft_id]
  - id: design
    type: builder.chat
    input:
      text: Show a useful first version now. Team members need to scan work by status, priority, owner and due date, open one item without losing the queue, add a request, assign it and move it through New, In progress, Blocked and Done. Include realistic examples and clear empty and overdue states.
      auto_apply: true
    expect:
      values: {ok: true}
      values_in: {status: [llm_pending, applied]}
  - id: wait
    type: builder.wait
    input:
      session_id: $steps.create.session_id
      job_id: $steps.design.llm_job.job_id
    expect: {values: {ok: true, status: succeeded}}
  - id: validate
    type: scenario.validate
    input: {scenario_id: $steps.create.scenario_id}
    expect: {values: {ok: true}}
  - id: grade
    type: prototype.grade
    input: {scenario_id: $steps.create.scenario_id, threshold: 0.85}
    expect: {values: {ok: true, passed: true}}
cleanup: {policy: always, retain_on_failure: true}
