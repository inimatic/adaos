schema: adaos.builder.e2e_case.v1
case_id: volunteer-roster-en
title: Volunteer roster
description: Visible development case for people, availability, and shift assignment.
locale: en
tags: [visible, people, scheduling]
requirements:
  primary_jobs:
    - statement: review availability
      acceptance: A visible collection exposes each volunteer's role and availability.
    - statement: fill shift
      acceptance: An executable create-assignment path lets the coordinator choose a shift and a volunteer.
      exclusions: [Overlap prevention is graded separately.]
    - statement: remove a person from a shift
      acceptance: An executable action removes the selected assignment without deleting the volunteer from the roster.
    - statement: contact volunteer
      acceptance: Contact fields are absent from the volunteer collection and available in a selected volunteer details surface.
      exclusions: [A persisted reveal flag or contact mutation is not required.]
    - statement: find coverage gap
      acceptance: A visible per-shift gap, remaining-capacity, or coverage-status value is sufficient; an aggregate dashboard is not required.
  representative_states:
    - statement: no volunteers
      acceptance: An explicit empty-volunteer collection state is renderable.
    - statement: unfilled shifts
      acceptance: At least one visible shift fixture explicitly has an unfilled or coverage-gap state.
      exclusions: [An empty assignment collection alone is insufficient.]
    - statement: fully staffed
      acceptance: At least one visible shift or day fixture explicitly states that it is fully staffed.
    - statement: conflicting availability
      acceptance: At least one visible assignment or availability fixture explicitly states a conflict.
prohibited_assumptions:
  - statement: private contact details are public
    acceptance: Violation requires contact fields in a collection or other default public surface; a selected details surface is permitted.
  - statement: one person can cover overlapping shifts
    acceptance: At Prototype stage, require either executable overlap prevention or a visible conflicting-assignment example together with an explicit pending automation requirement that discloses overlap is not enforced and preserves a test that overlapping assignments must be rejected. Never accept silence, a bare capability gap, or a claim that overlapping assignments are safe. Real cross-record enforcement is required at Automation acceptance, not Prototype acceptance.
steps:
  - id: create
    type: builder.chat
    input:
      text: Create a new application named "Volunteer Roster ${case_instance_id}" for coordinating a weekend community event.
      auto_apply: true
      owns_created_draft: true
    expect:
      values: {ok: true, project_status: ready}
      paths_present: [session_id, scenario_id, project_ref, artifact_root, draft_id]
  - id: design
    type: builder.chat
    input:
      text: Build a practical first version now. A coordinator needs to review volunteers and their roles and availability, see shifts and coverage gaps, assign or remove a person, avoid overlapping assignments, and open contact details only when needed. Include realistic examples and clear states for no volunteers, an unfilled shift, a fully staffed day and conflicting availability.
      auto_apply: true
    expect:
      values: {ok: true}
      values_in: {status: [llm_pending, applied]}
  - id: wait
    type: builder.wait
    input: {session_id: $steps.create.session_id, job_id: $steps.design.llm_job.job_id}
    expect: {values: {ok: true, status: succeeded}}
  - id: validate
    type: scenario.validate
    input: {scenario_id: $steps.create.scenario_id}
    expect: {values: {ok: true}}
  - id: grade
    type: prototype.grade
    input: {scenario_id: $steps.create.scenario_id, threshold: 0.85}
    expect: {values: {ok: true, passed: true}}
cleanup: {policy: always, retain_on_failure: true}
