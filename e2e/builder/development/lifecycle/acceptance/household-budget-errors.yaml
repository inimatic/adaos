schema: adaos.e2e.application_tools.v1
steps:
  - id: anonymous-read
    tool: budget_summary
    caller: anonymous
    expect: {values_in: {http_status: [401, 403]}}
  - id: invalid-money
    tool: budget_save
    arguments:
      entity: transaction
      request_token: '${case_instance_id}'
      values: &values
        type: expense
        date: '2112-03-01'
        Transaction.category: groceries
        Transaction.currency: USD
        person: alex
        amount: 'NaN'
        note: '${case_instance_id}'
    expect: {values: {http_status: 400}, text_contains: {body.detail: [finite]}}
  - id: invalid-precision
    tool: budget_save
    arguments:
      entity: transaction
      request_token: '${case_instance_id}'
      values: {<<: *values, amount: '0.001'}
    expect: {values: {http_status: 400}, text_contains: {body.detail: [decimal]}}
  - id: readonly-field
    tool: budget_save
    arguments:
      entity: transaction
      request_token: '${case_instance_id}'
      values: {<<: *values, amount: '1.00', exceeded: false}
    expect: {values: {http_status: 400}, text_contains: {body.detail: [read-only]}}
  - id: valid-create
    tool: budget_save
    arguments:
      entity: transaction
      request_token: '${case_instance_id}'
      values: {<<: *values, amount: '1.00'}
    expect: {values: {body.result.ok: true, body.result.item.revision: 1}}
  - id: request-conflict
    tool: budget_save
    arguments:
      entity: transaction
      request_token: '${case_instance_id}'
      values: {<<: *values, amount: '2.00'}
    expect: {values: {http_status: 400}, text_contains: {body.detail: [token]}}
  - id: valid-update
    tool: budget_save
    arguments:
      entity: transaction
      id: $steps.valid-create.body.result.item.id
      revision: 1
      values: {<<: *values, amount: '3.00'}
    expect: {values: {body.result.ok: true, body.result.item.revision: 2}}
  - id: stale-update
    tool: budget_save
    arguments:
      entity: transaction
      id: $steps.valid-create.body.result.item.id
      revision: 1
      values: {<<: *values, amount: '4.00'}
    expect: {values: {http_status: 400}, text_contains: {body.detail: [conflict]}}
  - id: stale-delete
    tool: budget_delete
    arguments: {entity: transaction, id: $steps.valid-create.body.result.item.id, revision: 1}
    expect: {values: {http_status: 400}, text_contains: {body.detail: [conflict]}}
  - id: conflicts-kept-value
    tool: budget_get
    arguments: {entity: transaction, id: $steps.valid-create.body.result.item.id}
    expect: {values: {body.result.item.amount: '3.00', body.result.item.revision: 2}}
  - id: cleanup-own-record
    tool: budget_delete
    arguments: {entity: transaction, id: $steps.valid-create.body.result.item.id, revision: 2}
    expect: {values: {body.result.ok: true}}
