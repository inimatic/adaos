schema: adaos.e2e.application_tools.v1
steps:
  - id: anonymous
    tool: inventory_read
    caller: anonymous
    arguments: {kind: items}
    expect: {values_in: {http_status: [401, 403]}}
  - id: category
    tool: inventory_command
    arguments: {kind: categories, request_token: '${case_instance_id}-category', values: {name: '${case_instance_id}'}}
    expect: {values: {body.result.ok: true, body.result.item.revision: 1}}
  - id: unit
    tool: inventory_command
    arguments: {kind: units, request_token: '${case_instance_id}-unit', values: {name: '${case_instance_id}-unit'}}
    expect: {values: {body.result.ok: true}}
  - id: item
    tool: inventory_command
    arguments:
      kind: items
      request_token: '${case_instance_id}-item'
      values: {items.name: '${case_instance_id}-item', sku: '${case_instance_id}', category: $steps.category.body.result.item.id, items.unit: $steps.unit.body.result.item.id, min_stock: 5}
    expect: {values: {body.result.ok: true, body.result.item.qty_on_hand: 0, body.result.item.is_below_min: true}}
  - id: receipt
    tool: inventory_command
    arguments: &receipt
      kind: movements
      request_token: '${case_instance_id}-receipt'
      values: {movements.item_id: $steps.item.body.result.item.id, direction: in, quantity: 10, note: '${case_instance_id}'}
    expect: {values: {body.result.ok: true, body.result.item.qty_change: 10}}
  - id: replay
    tool: inventory_command
    arguments: *receipt
    expect: {values: {body.result.ok: true, body.result.item.id: $steps.receipt.body.result.item.id}}
  - id: positive-balance
    tool: inventory_read
    arguments: &item-read {kind: items, id: $steps.item.body.result.item.id, single: true}
    expect: {values: {body.result.item.qty_on_hand: 10, body.result.item.is_below_min: false}}
  - id: issue
    tool: inventory_command
    arguments:
      kind: movements
      request_token: '${case_instance_id}-issue'
      values: {movements.item_id: $steps.item.body.result.item.id, direction: out, quantity: 3}
    expect: {values: {body.result.ok: true, body.result.item.qty_change: -3}}
  - id: concurrent-overspend
    tool: inventory_command
    concurrent_arguments:
      - {kind: movements, request_token: '${case_instance_id}-race-a', values: {movements.item_id: $steps.item.body.result.item.id, direction: out, quantity: 4}}
      - {kind: movements, request_token: '${case_instance_id}-race-b', values: {movements.item_id: $steps.item.body.result.item.id, direction: out, quantity: 4}}
    expect: {values: {http_statuses: [200, 200], success_count: 1}}
  - id: deficit
    tool: inventory_read
    arguments: *item-read
    expect: {values: {body.result.item.qty_on_hand: 3, body.result.item.is_below_min: true}}
  - id: category-filter
    tool: inventory_read
    arguments: {kind: items, filters: {category: $steps.category.body.result.item.id, is_below_min: true}}
    expect: {values: {body.result.items.0.id: $steps.item.body.result.item.id}, paths_absent: [body.result.items.1]}
  - id: other-category
    tool: inventory_read
    arguments: {kind: items, filters: {category: 'absent-category'}}
    expect: {values: {body.result.items: []}}
  - id: negative-movement
    tool: inventory_command
    arguments: {kind: movements, request_token: '${case_instance_id}-negative', values: {movements.item_id: $steps.item.body.result.item.id, direction: in, quantity: -1}}
    expect: {values: {body.result.ok: false, body.result.error: invalid_number}}
  - id: zero-movement
    tool: inventory_command
    arguments: {kind: movements, request_token: '${case_instance_id}-zero', values: {movements.item_id: $steps.item.body.result.item.id, direction: in, quantity: 0}}
    expect: {values: {body.result.ok: false, body.result.error: invalid_number}}
  - id: ledger-immutable
    tool: inventory_command
    arguments: {kind: movements, operation: delete, id: $steps.receipt.body.result.item.id, revision: 1}
    expect: {values: {body.result.ok: false, body.result.error: immutable_history}}
  - id: computed-not-writable
    tool: inventory_command
    arguments: {kind: items, id: $steps.item.body.result.item.id, revision: 1, values: {qty_on_hand: 100}}
    expect: {values: {body.result.ok: false, body.result.error: read_only_field}}
  - id: rename-item
    tool: inventory_command
    arguments: {kind: items, id: $steps.item.body.result.item.id, revision: 1, values: {items.name: '${case_instance_id}-updated'}}
    expect: {values: {body.result.ok: true, body.result.item.revision: 2, body.result.item.qty_on_hand: 3}}
  - id: stale-item
    tool: inventory_command
    arguments: {kind: items, id: $steps.item.body.result.item.id, revision: 1, values: {items.name: 'stale'}}
    expect: {values: {body.result.ok: false, body.result.error: revision_conflict}}
  - id: supplier-a
    tool: inventory_command
    arguments: {kind: suppliers, request_token: '${case_instance_id}-supplier-a', values: {suppliers.name: '${case_instance_id}-supplier-a'}}
    expect: {values: {body.result.ok: true}}
  - id: supplier-b
    tool: inventory_command
    arguments: {kind: suppliers, request_token: '${case_instance_id}-supplier-b', values: {suppliers.name: '${case_instance_id}-supplier-b'}}
    expect: {values: {body.result.ok: true}}
  - id: quote-usd
    tool: inventory_command
    arguments:
      kind: supplier_quotes
      request_token: '${case_instance_id}-quote-usd'
      values: {supplier_quotes.item_id: $steps.item.body.result.item.id, supplier_quotes.supplier_id: $steps.supplier-a.body.result.item.id, supplier_quotes.currency: USD, price_per_unit: 10, min_qty: 1, lead_time_days: 2}
    expect: {values: {body.result.ok: true}}
  - id: quote-eur
    tool: inventory_command
    arguments:
      kind: supplier_quotes
      request_token: '${case_instance_id}-quote-eur'
      values: {supplier_quotes.item_id: $steps.item.body.result.item.id, supplier_quotes.supplier_id: $steps.supplier-b.body.result.item.id, supplier_quotes.currency: EUR, price_per_unit: 9, min_qty: 2, lead_time_days: 5}
    expect: {values: {body.result.ok: true}}
  - id: quotes-separate
    tool: inventory_read
    arguments: {kind: supplier_quotes, filters: {supplier_quotes.item_id: $steps.item.body.result.item.id}}
    expect:
      values: {/body/result/items/0/supplier_quotes.currency: USD, /body/result/items/1/supplier_quotes.currency: EUR, body.result.items.0.price_per_unit: 10, body.result.items.1.lead_time_days: 5}
      paths_absent: [body.result.items.2]
  - id: request
    tool: inventory_command
    arguments: {kind: purchase_requests, request_token: '${case_instance_id}-request', values: {code: '${case_instance_id}', purchase_requests.currency: USD}}
    expect: {values: {body.result.ok: true, body.result.item.status: 'Черновик'}}
  - id: empty-submit
    tool: inventory_command
    arguments: {kind: purchase_requests, operation: submit, id: $steps.request.body.result.item.id, revision: 1}
    expect: {values: {body.result.ok: false, body.result.error: empty_request}}
  - id: line-a
    tool: inventory_command
    arguments:
      kind: purchase_request_lines
      request_token: '${case_instance_id}-line-a'
      values: &line-a {purchase_request_id: $steps.request.body.result.item.id, purchase_request_lines.item_id: $steps.item.body.result.item.id, purchase_request_lines.supplier_id: $steps.supplier-a.body.result.item.id, qty: 2, price: 10, currency: USD, lead_time_days: 2}
    expect: {values: {body.result.ok: true, /body/result/item/purchase_request_lines.unit: '${case_instance_id}-unit'}}
  - id: mixed-currency
    tool: inventory_command
    arguments: {kind: purchase_request_lines, request_token: '${case_instance_id}-mixed', values: {<<: *line-a, currency: EUR}}
    expect: {values: {body.result.ok: false, body.result.error: currency_mismatch}}
  - id: line-b
    tool: inventory_command
    arguments: {kind: purchase_request_lines, request_token: '${case_instance_id}-line-b', values: {<<: *line-a, purchase_request_lines.supplier_id: $steps.supplier-b.body.result.item.id, qty: 1, price: 3, lead_time_days: 5}}
    expect: {values: {body.result.ok: true}}
  - id: lines
    tool: inventory_read
    arguments: {kind: purchase_request_lines, filters: {purchase_request_id: $steps.request.body.result.item.id}}
    expect: {values: {body.result.items.0.id: $steps.line-a.body.result.item.id, body.result.items.1.id: $steps.line-b.body.result.item.id}, paths_absent: [body.result.items.2]}
  - id: no-parent
    tool: inventory_read
    arguments: {kind: purchase_request_lines, filters: {purchase_request_id: ''}}
    expect: {values: {body.result.items: []}}
  - id: other-parent
    tool: inventory_read
    arguments: {kind: purchase_request_lines, filters: {purchase_request_id: 'absent-parent'}}
    expect: {values: {body.result.items: []}}
  - id: line-edit
    tool: inventory_command
    arguments: {kind: purchase_request_lines, id: $steps.line-a.body.result.item.id, revision: 1, values: {qty: 4}}
    expect: {values: {body.result.ok: true, body.result.item.revision: 2, body.result.item.qty: 4}}
  - id: request-latest
    tool: inventory_read
    arguments: {kind: purchase_requests, id: $steps.request.body.result.item.id, single: true}
    expect: {values: {body.result.item.revision: 4, body.result.item.status: 'Черновик'}}
  - id: submitted
    tool: inventory_command
    arguments: &submit {kind: purchase_requests, operation: submit, id: $steps.request.body.result.item.id, revision: $steps.request-latest.body.result.item.revision}
    expect: {values: {body.result.ok: true, body.result.item.status: 'На согласовании', body.result.item.revision: 5}, paths_present: [body.result.item.submitted_at]}
  - id: submitted-replay
    tool: inventory_command
    arguments: *submit
    expect: {values: {body.result.ok: true, body.result.item.revision: 5}}
  - id: line-locked
    tool: inventory_command
    arguments: {kind: purchase_request_lines, id: $steps.line-a.body.result.item.id, revision: 2, values: {qty: 99}}
    expect: {values: {body.result.ok: false, body.result.error: submitted}}
  - id: line-delete-locked
    tool: inventory_command
    arguments: {kind: purchase_request_lines, operation: delete, id: $steps.line-b.body.result.item.id, revision: 1}
    expect: {values: {body.result.ok: false, body.result.error: submitted}}
  - id: request-locked
    tool: inventory_command
    arguments: {kind: purchase_requests, id: $steps.request.body.result.item.id, revision: 5, values: {notes: 'should not save'}}
    expect: {values: {body.result.ok: false, body.result.error: submitted}}
  - id: supplier-dependencies
    tool: inventory_command
    arguments: {kind: suppliers, operation: delete, id: $steps.supplier-a.body.result.item.id, revision: 1}
    expect: {values: {body.result.ok: false, body.result.error: dependencies}}
  - id: stock-history-kept
    tool: inventory_read
    arguments: *item-read
    expect: {values: {body.result.item.qty_on_hand: 3, /body/result/item/items.name: '${case_instance_id}-updated', body.result.item.revision: 2}}
