schema: adaos.e2e.application_tools.v1
steps:
  - id: anonymous
    tool: list_articles
    caller: anonymous
    arguments: {}
    expect: {values_in: {http_status: [401, 403]}}
  - id: token
    tool: new_article_token
    arguments: {}
    expect: {paths_present: [body.result.token]}
  - id: create
    tool: save_article
    arguments: &create
      operation: create
      request_token: $steps.token.body.result.token
      values: &values
        title: '${case_instance_id}'
        content: "# Persistent document\n\nFirst paragraph.\n\nLast paragraph needle-final-content."
        topic: DevOps
        owner: Review Owner
        tags: [one, two]
        attachments: ['https://example.com/guide.pdf']
        cover_image: ''
    expect: {values: {body.result.ok: true, body.result.item.status: draft, body.result.item.revision: 1}}
  - id: replay
    tool: save_article
    arguments: *create
    expect: {values: {body.result.ok: true, body.result.item.id: $steps.create.body.result.item.id}}
  - id: reused-token
    tool: save_article
    arguments: {<<: *create, values: {<<: *values, title: different}}
    expect: {values: {body.result.ok: false, body.result.error: validation_error}}
  - id: full-read
    tool: get_article
    arguments: {id: $steps.create.body.result.item.id}
    expect:
      values:
        body.result.item.content: "# Persistent document\n\nFirst paragraph.\n\nLast paragraph needle-final-content."
        body.result.item.attachments.0: https://example.com/guide.pdf
        body.result.item.tags_text: one, two
  - id: search-content
    tool: list_articles
    arguments: {search: '${case_instance_id} needle-final-content', topic: DevOps, owner: 'review owner', status: draft}
    expect: {values: {body.result.items.0.id: $steps.create.body.result.item.id}, paths_absent: [body.result.items.1]}
  - id: wrong-topic
    tool: list_articles
    arguments: {search: '${case_instance_id}', topic: Security}
    expect: {paths_absent: [body.result.items.0]}
  - id: wrong-owner
    tool: list_articles
    arguments: {search: '${case_instance_id}', owner: Nobody}
    expect: {paths_absent: [body.result.items.0]}
  - id: invalid-link
    tool: save_article
    arguments: {operation: save, id: $steps.create.body.result.item.id, revision: 1, values: {attachments: ['javascript:alert(1)']}}
    expect: {values: {body.result.ok: false, body.result.error: validation_error}}
  - id: forged-status
    tool: save_article
    arguments: {operation: save, id: $steps.create.body.result.item.id, revision: 1, values: {status: published}}
    expect: {values: {body.result.ok: false, body.result.error: validation_error}}
  - id: save
    tool: save_article
    arguments: {operation: save, id: $steps.create.body.result.item.id, revision: 1, values: {owner: Changed Owner}}
    expect: {values: {body.result.ok: true, body.result.item.revision: 2, body.result.item.owner: Changed Owner}}
  - id: stale
    tool: save_article
    arguments: {operation: save, id: $steps.create.body.result.item.id, revision: 1, values: {title: Lost update}}
    expect: {values: {body.result.ok: false, body.result.error: revision_conflict}}
  - id: publish
    tool: save_article
    arguments: {operation: publish, id: $steps.create.body.result.item.id, revision: 2}
    expect: {values: {body.result.ok: true, body.result.item.revision: 3, body.result.item.status: published}}
  - id: published-search
    tool: list_articles
    arguments: {search: '${case_instance_id}', status: published}
    expect: {values: {body.result.items.0.id: $steps.create.body.result.item.id}, paths_absent: [body.result.items.1]}
  - id: empty-published
    tool: save_article
    arguments: {operation: save, id: $steps.create.body.result.item.id, revision: 3, values: {content: ''}}
    expect: {values: {body.result.ok: false, body.result.error: validation_error}}
  - id: race
    tool: save_article
    concurrent_arguments:
      - {operation: save, id: $steps.create.body.result.item.id, revision: 3, values: {owner: First}}
      - {operation: save, id: $steps.create.body.result.item.id, revision: 3, values: {owner: Second}}
    expect: {values: {success_count: 1}}
  - id: retained-content
    tool: get_article
    arguments: {id: $steps.create.body.result.item.id}
    expect:
      values:
        body.result.item.revision: 4
        body.result.item.content: "# Persistent document\n\nFirst paragraph.\n\nLast paragraph needle-final-content."
      values_in: {body.result.item.owner: [First, Second]}
  - id: archive
    tool: save_article
    arguments: {operation: archive, id: $steps.create.body.result.item.id, revision: 4}
    expect: {values: {body.result.ok: true, body.result.item.revision: 5, body.result.item.status: archived}}
  - id: hidden-default
    tool: list_articles
    arguments: {search: '${case_instance_id}'}
    expect: {paths_absent: [body.result.items.0]}
  - id: archive-search
    tool: list_articles
    arguments: {search: '${case_instance_id}', status: archived}
    expect: {values: {body.result.items.0.id: $steps.create.body.result.item.id}, paths_absent: [body.result.items.1]}
  - id: archived-write
    tool: save_article
    arguments: {operation: save, id: $steps.create.body.result.item.id, revision: 5, values: {content: changed}}
    expect: {values: {body.result.ok: false, body.result.error: archived_read_only}}
  - id: archived-publish
    tool: save_article
    arguments: {operation: publish, id: $steps.create.body.result.item.id, revision: 5}
    expect: {values: {body.result.ok: false, body.result.error: archived_read_only}}
  - id: retained-archive
    tool: get_article
    arguments: {id: $steps.create.body.result.item.id}
    expect: {values: {body.result.item.revision: 5, body.result.item.status: archived, body.result.item.tags_text: 'one, two'}}
  - id: empty-token
    tool: new_article_token
    arguments: {}
    expect: {paths_present: [body.result.token]}
  - id: empty-draft
    tool: save_article
    arguments: {operation: create, request_token: $steps.empty-token.body.result.token, values: {<<: *values, title: '${case_instance_id}-empty', content: ''}}
    expect: {values: {body.result.ok: true, body.result.item.status: draft}}
  - id: reject-empty-publish
    tool: save_article
    arguments: {operation: publish, id: $steps.empty-draft.body.result.item.id, revision: 1}
    expect: {values: {body.result.ok: false, body.result.error: validation_error}}
