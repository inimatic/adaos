schema: adaos.e2e.application_tools.v1
steps:
  - id: anonymous
    tool: roster_list
    caller: anonymous
    arguments: {kind: Volunteer}
    expect: {values_in: {http_status: [401, 403]}}
  - id: volunteer
    tool: roster_save
    arguments: &volunteer
      kind: Volunteer
      request_token: '${case_instance_id}-volunteer'
      values: &person
        name: '${case_instance_id}-person'
        Volunteer.role: Greeter
        contact_email: 'acceptance@example.com'
        contact_phone: '+10000000000'
        availability: '2114-01-01T08:00Z/2114-01-01T18:00Z'
        availability_note: 'Independent acceptance'
    expect: {values: {body.result.ok: true, body.result.item.revision: 1}}
  - id: replay
    tool: roster_save
    arguments: *volunteer
    expect: {values: {body.result.ok: true, body.result.item.id: $steps.volunteer.body.result.item.id}}
  - id: second-person
    tool: roster_save
    arguments:
      kind: Volunteer
      request_token: '${case_instance_id}-second'
      values: {<<: *person, name: '${case_instance_id}-second'}
    expect: {values: {body.result.ok: true}}
  - id: shift
    tool: roster_save
    arguments:
      kind: Shift
      request_token: '${case_instance_id}-shift'
      values: &shift {Shift.role: Greeter, start: '2114-01-01T09:00Z', end: '2114-01-01T10:00Z', required_count: 1}
    expect: {values: {body.result.ok: true, body.result.item.filled_count: 0, body.result.item.unfilled_count: 1}}
  - id: overlapping-shift
    tool: roster_save
    arguments:
      kind: Shift
      request_token: '${case_instance_id}-overlap'
      values: {<<: *shift, start: '2114-01-01T09:30Z', end: '2114-01-01T10:30Z'}
    expect: {values: {body.result.ok: true}}
  - id: adjacent-shift
    tool: roster_save
    arguments:
      kind: Shift
      request_token: '${case_instance_id}-adjacent'
      values: {<<: *shift, start: '2114-01-01T10:00Z', end: '2114-01-01T11:00Z'}
    expect: {values: {body.result.ok: true}}
  - id: assignment
    tool: roster_save
    arguments:
      kind: Assignment
      request_token: '${case_instance_id}-assignment'
      values: &assignment {volunteer_id: $steps.volunteer.body.result.item.id, shift_id: $steps.shift.body.result.item.id, notes: '${case_instance_id}'}
    expect: {values: {body.result.ok: true, body.result.item.status: active}}
  - id: duplicate
    tool: roster_save
    arguments: {kind: Assignment, request_token: '${case_instance_id}-duplicate', values: *assignment}
    expect: {values: {body.result.ok: false, body.result.error: duplicate_assignment}}
  - id: capacity
    tool: roster_save
    arguments:
      kind: Assignment
      request_token: '${case_instance_id}-capacity'
      values: {<<: *assignment, volunteer_id: $steps.second-person.body.result.item.id}
    expect: {values: {body.result.ok: false, body.result.error: capacity}}
  - id: overlap
    tool: roster_save
    arguments:
      kind: Assignment
      request_token: '${case_instance_id}-bad-overlap'
      values: {<<: *assignment, shift_id: $steps.overlapping-shift.body.result.item.id}
    expect: {values: {body.result.ok: false, body.result.error: overlap}}
  - id: adjacent
    tool: roster_save
    arguments:
      kind: Assignment
      request_token: '${case_instance_id}-good-adjacent'
      values: {<<: *assignment, shift_id: $steps.adjacent-shift.body.result.item.id}
    expect: {values: {body.result.ok: true}}
  - id: reassign-refused
    tool: roster_save
    arguments:
      kind: Assignment
      id: $steps.assignment.body.result.item.id
      revision: 1
      values: {<<: *assignment, shift_id: $steps.overlapping-shift.body.result.item.id}
    expect: {values: {body.result.ok: false, body.result.error: overlap}}
  - id: original-retained
    tool: roster_get
    arguments: {kind: Assignment, id: $steps.assignment.body.result.item.id}
    expect: {values: {body.result.item.revision: 1, body.result.item.shift_id: $steps.shift.body.result.item.id}}
  - id: availability-change-refused
    tool: roster_save
    arguments:
      kind: Volunteer
      id: $steps.volunteer.body.result.item.id
      revision: 1
      values: {<<: *person, availability: '2114-01-01T12:00Z/2114-01-01T18:00Z'}
    expect: {values: {body.result.ok: false, body.result.error: unavailable}}
  - id: full-count
    tool: roster_get
    arguments: {kind: Shift, id: $steps.shift.body.result.item.id}
    expect: {values: {body.result.item.filled_count: 1, body.result.item.unfilled_count: 0, body.result.item.coverage_status: full}}
  - id: cancel
    tool: roster_cancel
    arguments: {id: $steps.assignment.body.result.item.id, revision: 1}
    expect: {values: {body.result.ok: true, body.result.item.status: cancelled, body.result.item.revision: 2}}
  - id: freed
    tool: roster_get
    arguments: {kind: Shift, id: $steps.shift.body.result.item.id}
    expect: {values: {body.result.item.filled_count: 0, body.result.item.unfilled_count: 1, body.result.item.coverage_status: unfilled}}
  - id: cancelled-history
    tool: roster_list
    arguments: {kind: Assignment, query: {filters: {shift_id: $steps.shift.body.result.item.id}}}
    expect: {values: {body.result.items.0.status: cancelled}, paths_absent: [body.result.items.1]}
  - id: cancelled-not-editable
    tool: roster_save
    arguments: {kind: Assignment, id: $steps.assignment.body.result.item.id, revision: 2, values: *assignment}
    expect: {values: {body.result.ok: false, body.result.error: cancelled}}
  - id: reassign-success
    tool: roster_save
    arguments: {kind: Assignment, id: $steps.adjacent.body.result.item.id, revision: 1, values: *assignment}
    expect: {values: {body.result.ok: true, body.result.item.shift_id: $steps.shift.body.result.item.id, body.result.item.revision: 2}}
  - id: stale
    tool: roster_save
    arguments: {kind: Assignment, id: $steps.adjacent.body.result.item.id, revision: 1, values: *assignment}
    expect: {values: {body.result.ok: false, body.result.error: revision_conflict}}
  - id: invalid-timezone
    tool: roster_save
    arguments: {kind: Shift, request_token: '${case_instance_id}-timezone', values: {<<: *shift, start: '2114-01-01T09:00'}}
    expect: {values: {body.result.ok: false, body.result.error: invalid_input}}
  - id: invalid-interval
    tool: roster_save
    arguments: {kind: Shift, request_token: '${case_instance_id}-interval', values: {<<: *shift, start: '2114-01-01T10:00Z'}}
    expect: {values: {body.result.ok: false, body.result.error: invalid_interval}}
  - id: invalid-capacity
    tool: roster_save
    arguments: {kind: Shift, request_token: '${case_instance_id}-zero', values: {<<: *shift, required_count: 0}}
    expect: {values: {body.result.ok: false, body.result.error: invalid_capacity}}
  - id: forged-computed
    tool: roster_save
    arguments: {kind: Shift, request_token: '${case_instance_id}-forged', values: {<<: *shift, filled_count: 0}}
    expect: {values: {body.result.ok: false, body.result.error: read_only}}
  - id: missing-parent
    tool: roster_save
    arguments: {kind: Assignment, request_token: '${case_instance_id}-missing', values: {<<: *assignment, volunteer_id: 'missing'}}
    expect: {values: {body.result.ok: false, body.result.error: not_found}}
  - id: private-list
    tool: roster_list
    arguments: {kind: Volunteer, query: {search: '${case_instance_id}-person'}}
    expect: {values: {body.result.items.0.name: '${case_instance_id}-person'}, paths_absent: [body.result.items.0.contact_email, body.result.items.1]}
  - id: private-detail
    tool: roster_get
    arguments: {kind: Volunteer, id: $steps.volunteer.body.result.item.id}
    expect: {values: {body.result.item.contact_email: 'acceptance@example.com'}}
  - id: capacity-race
    tool: roster_save
    concurrent_arguments:
      - {kind: Assignment, request_token: '${case_instance_id}-race-a', values: {<<: *assignment, shift_id: $steps.adjacent-shift.body.result.item.id}}
      - {kind: Assignment, request_token: '${case_instance_id}-race-b', values: {<<: *assignment, shift_id: $steps.adjacent-shift.body.result.item.id, volunteer_id: $steps.second-person.body.result.item.id}}
    expect: {values: {success_count: 1}}
  - id: bounded-count
    tool: roster_get
    arguments: {kind: Shift, id: $steps.adjacent-shift.body.result.item.id}
    expect: {values: {body.result.item.filled_count: 1, body.result.item.unfilled_count: 0}}
