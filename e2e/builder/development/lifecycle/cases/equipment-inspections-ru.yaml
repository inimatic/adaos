schema: adaos.builder.e2e_case.v1
case_id: equipment-inspections-lifecycle-ru
title: Осмотр оборудования, полный малый цикл
description: Приемка прототипа с отдельным заданием на работающую автоматизацию.
locale: ru
tags: [visible, lifecycle, inspection]
requirements:
  primary_jobs:
    - statement: начать осмотр выбранного оборудования
      acceptance: Можно выбрать объект и создать либо открыть связанный осмотр.
    - statement: заполнить пункты проверки
      acceptance: Результат, измерение, комментарий и фотография или ссылка сохраняются в пункте конкретного осмотра.
    - statement: сохранить черновик и завершить осмотр
      acceptance: Черновик можно сохранять независимо от завершения. Межзаписочный запрет завершения осмотра с дефектом без комментария допустимо явно отложить до Automation при доступном примере нарушения; поддерживаемые проверки одной записи должны исполняться.
  representative_states:
    - statement: нет назначенных осмотров
    - statement: незавершенный осмотр
    - statement: обнаружен дефект
prohibited_assumptions:
  - statement: демонстрационные данные доказывают производственную автоматизацию
    acceptance: Рабочий прототип не выдается за установленное приложение с реализованными межзаписочными правилами.
steps:
  - id: create
    type: builder.chat
    input:
      text: Создай новое приложение "Осмотр оборудования ${case_instance_id}" для выездного техника.
      auto_apply: true
      owns_created_draft: true
    expect:
      values: {ok: true, project_status: ready}
      paths_present: [session_id, scenario_id, project_ref, artifact_root, draft_id]
  - id: design
    type: builder.chat
    input:
      text: Сделай рабочую первую версию. Техник выбирает объект, проходит повторяемый список проверок, отмечает результат каждого пункта, добавляет измерение, комментарий и фотографию дефекта, сохраняет незавершенный осмотр и затем завершает его. Покажи правдоподобные данные, состояние без назначенных осмотров и запрети завершение дефекта без комментария.
      auto_apply: true
    expect: {values: {ok: true}, values_in: {status: [llm_pending, applied]}}
  - id: wait
    type: builder.wait
    input: {session_id: $steps.create.session_id, job_id: $steps.design.llm_job.job_id}
    expect: {values: {ok: true, status: succeeded}}
  - id: validate
    type: scenario.validate
    input: {scenario_id: $steps.create.scenario_id}
    expect: {values: {ok: true}}
  - id: grade
    type: prototype.grade
    input: {scenario_id: $steps.create.scenario_id, threshold: 0.85}
    expect: {values: {ok: true, passed: true}}
  - id: browser-commands
    type: prototype.browser
    input: {object_id: $steps.create.scenario_id, probe: commands, timeout_seconds: 300}
    expect: {values: {ok: true}}
  - id: browser-review
    type: prototype.browser
    input: {object_id: $steps.create.scenario_id, probe: review, timeout_seconds: 240}
    expect: {values: {ok: true}}
  - id: browser-interactions
    type: prototype.browser
    input: {object_id: $steps.create.scenario_id, probe: interactions, timeout_seconds: 300}
    expect: {values: {ok: true}}
  - id: browser-capabilities
    type: prototype.browser
    input: {object_id: $steps.create.scenario_id, probe: capabilities, timeout_seconds: 240}
    expect: {values: {ok: true}}
  - id: approve
    type: prototype.accept
    input:
      object_id: $steps.create.scenario_id
      review_file: reviews/${case_id}-${repetition}.json
      wait_seconds: 1200
    expect: {values: {ok: true}}
  - id: implement
    type: automation.start
    input:
      object_id: $steps.create.scenario_id
      implementation_brief: |
        Автоматизируй принятый интерфейс осмотра оборудования как небольшое работающее приложение.
        Сохрани навигацию и доступные пользователю действия принятого прототипа.
        Демонстрационные записи и временное хранилище прототипа не должны становиться рабочими данными.
        Новая установка начинается с пустыми рабочими данными и понятными пустыми состояниями.
        Пользователь может создавать оборудование, осмотры конкретного оборудования и пункты конкретного осмотра.
        Сохраняй записи и вложения либо поддерживаемые ссылки так, чтобы они переживали перезапуск и обновление приложения.
        Проверяй существование связанного оборудования и осмотра; не допускай удаления объекта с существующими зависимостями без явного безопасного решения.
        Черновик можно сохранять с незаполненными пунктами. При завершении сервер должен атомарно проверить все пункты этого осмотра:
        есть хотя бы один пункт, каждый имеет результат, у каждого дефекта есть непустой комментарий.
        При нарушении отклони завершение и оставь осмотр черновиком, покажи причину и проблемные пункты.
        Завершенные осмотры и их пункты доступны для чтения, но не для обычного редактирования.
        Запрос со старой ревизией записи не должен молча перезаписывать более новые изменения.
        Техник с правом записи может создавать и менять черновики; читатель не может изменять записи даже прямым вызовом операции.
        При недоступности хранилища, отказе доступа, конфликте версии или ошибке вложения не показывай ложный успех и сохраняй введенный черновик в интерфейсе.
        Используй поддерживаемые механизмы платформы. Если необходимого контракта нет, явно сообщи блокер, не обходи права и не подменяй серверную проверку экранным флагом.
        Добавь исполняемые проверки сохранения, повторного открытия, связей, отказов доступа, конфликтов ревизий и запрета неправильного завершения.
        Данные предыдущей установленной версии должны сохраняться при последующем совместимом обновлении.
    expect: {values: {ok: true}, paths_present: [session.session_id]}
  - id: implementation-result
    type: automation.wait
    input: {object_id: $steps.create.scenario_id, session_id: $steps.implement.session.session_id, timeout_seconds: 1800}
    expect: {values: {ok: true, status: completed}}
  - id: trial
    type: trial.prepare
    input: {object_id: $steps.create.scenario_id, project_ref: $steps.create.project_ref}
    expect: {values: {ok: true}, paths_present: [candidate.candidate_id]}
cleanup: {policy: never, retain_on_failure: true}
