schema: adaos.e2e.frozen_automation.v1
case_id: equipment-inspections-frozen-ru
steps:
  - id: approve
    type: prototype.accept
    input: {review_file: reviews/accepted-prototype.json}
    expect: {values: {ok: true}}
  - id: implement
    type: automation.start
    input:
      implementation_brief: |
        Автоматизируй согласованный прототип осмотра оборудования. Это НЕ новая генерация Prototype.
        Эталон: уже принятая ревизия и ее WebUI, ресурсы и локали из handoff. Сохрани структуру:
        таблица объектов слева, список осмотров выбранного объекта справа, таблица пунктов под осмотрами;
        поиск объектов, поиск и фильтр статуса осмотров, фильтр результата пунктов, отдельные редакторы.
        Клик по объекту выбирает детализацию. Добавь явную доступную команду редактирования выбранного
        оборудования, чтобы она не конфликтовала с выбором осмотров. Пункт проверки открывает свой редактор.
        Не убирай существующие поля, подписи, фильтры, состояния, связи и доступные действия ради упрощения кода.

        Дополнения к прототипу для работы с пустой установкой:
        - Создание и редактирование оборудования (название, локация), отмена без записи.
        - Создание осмотра выбранного оборудования. В форме видны название текущего оборудования или
          доступный dropdown существующих объектов. Пустой readonly идентификатор недопустим.
        - Создание пунктов выбранного осмотра. Родитель виден понятным названием, связь сохраняется на сервере.
        - Выбор другого объекта сбрасывает осмотр и пункт; выбор другого осмотра сбрасывает пункт.
          Пока родитель не выбран, зависимые списки не показывают чужие записи, а команды создания недоступны.
        - Начало осмотра, заметка, результат пункта, измерение, комментарий, фотография или HTTPS-ссылка.
          Сохрани названия и типы полей эталона. Для файлов используй только поддерживаемое постоянное хранилище;
          если для реальных файлов нет контракта, явно замени поле на подписанную ссылку на фотографию,
          не используй временное prototype file storage и не имитируй загрузку.

        Правила Automation (имеют приоритет над демонстрационными ограничениями прототипа):
        - Рабочие данные изначально пусты. Фикстуры принятого прототипа не становятся рабочими записями.
        - Данные сохраняются вне пакета приложения и переживают перезапуск процесса, повторное открытие,
          совместимое обновление. Все выборки фильтруются на сервере, а не только на экране.
        - Черновик осмотра и дефектный пункт можно сохранить без результата или комментария.
          Запрет относится к завершению ОСМОТРА: атомарно требуется хотя бы один пункт, результат каждого
          пункта и непустой комментарий каждого дефекта. Отказ сохраняет статус черновика и показывает
          причину и проблемные пункты. Никакой подмены серверной проверки экранным enabledIf.
        - Завершенные осмотры и их пункты доступны только для чтения. Ввод законченного осмотра
          нельзя разблокировать обычным обновлением статуса. Проверяй родительскую блокировку на сервере.
        - Проверяй существование родителей. Запрещай удаление записи с зависимостями без каскадной потери данных.
        - Проверяй ревизию при обновлении и удалении. Старый запрос не перезаписывает свежую запись.
        - Все чтения и изменения требуют поддерживаемого доступа. Читатель не может изменять записи
          прямым вызовом операции; локальный DEV preview использует свою настоящую identity.
          Не выдавай DEV control credential за доказательство прав делегированного читателя.
        - Ошибка доступа, сети, хранилища, ревизии или ссылки не закрывает редактор, не теряет ввод
          и не вызывает ложного сообщения об успехе. Повторное сохранение не создает дубликат без намерения.
        - Сохрани RU и EN словари прототипа для старых элементов, добавь локализацию новых элементов.

        Проверь реальные пользовательские пути, а не только существование modal или handler:
        создание объекта -> редактирование -> осмотр с видимым родителем -> пункт -> черновик ->
        отказ неправильного завершения -> исправление -> успешное завершение -> блокировка изменений ->
        повторное открытие. Проверь пустой/невыбранный контекст, поиск/фильтры, отмену, конфликт и ошибку.
        Тесты отдельного навыка не должны читать соседний scenario: UI-контракт проверяй в tests сценария.
        Добавь независимые от seed проверки постоянного хранения и бизнес-правил; тесты не должны
        доказывать только наличие строк в WebUI или совпадение собственных ожиданий с собственным кодом.
        Если платформенный контракт отсутствует, сообщи точный блокер. Не добавляй предметную логику
        в Core/Client и не копируй решения других тестовых приложений. Trial и публикацию не выполнять.
    expect: {values: {ok: true}, paths_present: [session.session_id]}
  - id: result
    type: automation.wait
    input: {session_id: $steps.implement.session.session_id, timeout_seconds: 1800}
    expect: {values: {ok: true, status: completed}}
