schema: adaos.conversational.package_manifest.v1
package_id: conversational_release_skill
package_kind: skill
owner_ref:
  kind: skill
  id: conversational_release_skill
version: 0.1.0
workflow_refs:
  - workflow_type: example.release
    definition_ref: ../workflow.json
    definition_version: 1.0.0
    definition_digest: null
files:
  input: input.yaml
  entities: entities.yaml
  examples: examples.yaml
  matchers: matchers.yaml
  affordances: affordances.yaml
  repair: repair.yaml
  output: output.yaml
  stories:
    - tests/stories/submit.yaml
    - tests/stories/no-match.yaml
  locales:
    - locale.en.yaml
locales:
  - en
default_locale: en
privacy_defaults:
  source_scope: skill
  runtime_overlay_scope: user
  public_promotion: requires_review
compiled_outputs: []
compatibility_aliases: []
metadata:
  purpose: executable_reference
