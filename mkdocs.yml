strict: true
site_name: AdaOS
site_description: "AdaOS 2027 stable public documentation"
site_url: https://inimatic.github.io/adaos/
repo_url: https://github.com/inimatic/adaos
repo_name: inimatic/adaos
edit_uri: edit/rev2026/docs-stable/2027/
docs_dir: docs-stable/2027

theme:
  name: material
  logo: assets/adaos_wb.svg
  favicon: assets/ADAOS_32_light.png
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: green
      accent: yellow
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: green
      accent: yellow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/inimatic/adaos

plugins:
  - search:
      lang: [en]

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - tables
  - def_list
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Product:
      - Product Tracks: product/index.md
      - Solution Directions: product/solution-directions.md
      - Media Center: media-center/index.md
      - Builder: builder/index.md
  - Start:
      - Quickstart: quickstart.md
      - Deployment: deployment.md
      - Browser And Member Connection: onboarding/browser-and-member.md
      - Member Node Onboarding: onboarding/member-node-phase1.md
  - Operations:
      - Common Commands: operations/common-commands.md
      - Versioning And Health: operations/versioning.md
      - Runtime Operations: cli/runtime.md
  - Architecture:
      - Overview: architecture/overview.md
      - Devices And Browsers: architecture/device-access-and-browsers.md
      - Member-Hub Connectivity: architecture/member-hub-connectivity.md
      - Privacy And Security: architecture/privacy-and-security.md
  - Reference:
      - CLI: reference/cli.md
  - Documentation:
      - Structure: documentation-structure.md
      - Language Policy: documentation-language-policy.md

copyright: |
  &copy; 2026 AdaOS
