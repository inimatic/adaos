strict: true
site_name: AdaOS
site_description: "AdaOS product, developer, runtime, and architecture documentation"
site_url: https://inimatic.github.io/adaos/
repo_url: https://github.com/inimatic/adaos
repo_name: inimatic/adaos
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/adaos_wb.svg
  favicon: assets/ADAOS_32_light.png
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: green
      accent: yellow
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: green
      accent: yellow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/inimatic/adaos

plugins:
  - search:
      lang: [en, ru]
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      languages:
        - locale: en
          name: English
          default: true
        - locale: ru
          name: Русский
          nav:
            - Главная: index.md
            - Продукт:
                - Продуктовая модель: product/index.md
                - Направления решений: product/solution-directions.md
                - Язык и перевод документации: documentation-language-policy.md
            - Английская документация:
                - Home: https://inimatic.github.io/adaos/
                - Documentation Structure: https://inimatic.github.io/adaos/documentation-structure/
                - Issue Tracker: https://inimatic.github.io/adaos/issue-tracker/
                - Quickstart: https://inimatic.github.io/adaos/quickstart/
                - Deployment: https://inimatic.github.io/adaos/deployment/
                - Operations: https://inimatic.github.io/adaos/cli/runtime/
                - Architecture: https://inimatic.github.io/adaos/architecture/
                - CLI: https://inimatic.github.io/adaos/cli/
                - SDK: https://inimatic.github.io/adaos/sdk/
                - IO: https://inimatic.github.io/adaos/interfaces/overview/
                - Skills: https://inimatic.github.io/adaos/skills/
                - Scenarios: https://inimatic.github.io/adaos/scenarios/
                - DevPortal: https://inimatic.github.io/adaos/devportal/
                - Guides: https://inimatic.github.io/adaos/guides/testing/
                - Roadmaps: https://inimatic.github.io/adaos/architecture/roadmap-inventory/
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
      fallback_to_build_date: true
      # This repository contains paths whose retained Git history does not
      # produce a revision entry for the plugin's rename-excluding query.
      # Keep the configured build-date fallback informational so MkDocs strict
      # mode remains a gate for documentation warnings it can act on.
      strict: false
      type: date

watch:
  - src/adaos

extra_css:
  - assets/graphviz-fix.css

extra_javascript:
  - https://cdn.jsdelivr.net/gh/rod2ik/cdn@main/mkjavascripts/mkdocs-graphviz.js
  - https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - tables
  - def_list
  - pymdownx.details
  - pymdownx.mark
  - mkdocs_graphviz
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

