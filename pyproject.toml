[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=65.0", "wheel"]

[project]
description = "AdaOS - a local-first platform for distributed assistant environments"
license = {text = "MIT"}
name = "adaos"
readme = "README.md"
requires-python = ">=3.11.9,<3.12"
version = "0.1.941"

authors = [
  {name = "AdaOS Team"},
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
]

dependencies = [
  "typer>=0.16.0",
  "rich>=13.7.1",
  "python-dotenv>=1.0.1",
  "openai>=1.43.0",
  "GitPython>=3.1.43",
  "SQLAlchemy>=2.0.32",
  "sqlite-utils>=3.36",
  "jsonschema>=4.23.0",
  "packaging>=24.1",
  "PyYAML>=6.0.2",
  "pytest>=8.3.2",
  "watchdog>=4.0.1",
  "sounddevice>=0.4.7",
  "requests>=2.31.0",
  "pyttsx3",
  "uvicorn",
  "fastapi",
  "y-py @ https://github.com/inimatic/adaos/releases/download/y-py-v0.6.2-adaos.1/y_py-0.6.2%2Badaos.1-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "y-py @ https://github.com/inimatic/adaos/releases/download/y-py-v0.6.2-adaos.1/y_py-0.6.2%2Badaos.1-cp311-cp311-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "y-py @ https://github.com/inimatic/adaos/releases/download/y-py-v0.6.2-adaos.1/y_py-0.6.2%2Badaos.1-cp311-cp311-macosx_11_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "y-py @ https://github.com/inimatic/adaos/releases/download/y-py-v0.6.2-adaos.1/y_py-0.6.2%2Badaos.1-cp311-cp311-macosx_10_15_x86_64.whl ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "ypy-websocket>=0.12.4",
  "httpx>=0.27.0",
  "aiohttp>=3.10.0",
  "nats-py>=2.6.0",
  "websockets>=11.0",
  "ipykernel",
  "keyring>=24.2.0",
  "cryptography>=42.0.0,<49.0.0 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "cryptography>=42.0.0 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "psutil>=5.9.0",
  "aiortc>=1.9.0,<1.11.0 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "aiortc>=1.9.0 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.scripts]
adaos = "adaos.apps.cli.app:app"

[project.urls]
Homepage = "https://github.com/inimatic/adaos"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
# EXTRA_MODULES_START
# EXTRA_MODULES_END
where = ["src"]
[tool.setuptools.package-data]
adaos = [
  "skills_templates/**/*.yaml",
  "skills_templates/**/*.yml",
  "skills_templates/**/*.json",
  "skills_templates/**/*.md",
  "skills_templates/**/*.py",
  "skills_templates/**/*.intent",
  "skills_templates/**/tests/**/*",
  "scenario_templates/**/*.json",
  "scenario_templates/**/*.md",
  "abi/*.json",
  "services/builder/*.json",
  "services/skill/*.json",
  "system_assets/**/*",
  "locales/*.json",
  "interpreter_data/**/*",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "anyio>=4", "responses>=0.25", "pytest-cov>=5"]
offline-stt = ["vosk>=0.3.45"]
postgres = ["psycopg[binary]>=3.2"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
markers = [
  "integration: integration tests",
  "e2e: end-to-end tests",
  "asyncio: asyncio tests",
]
testpaths = [
  "tests", # SDK/API tests
  "src/adaos/skills/**/tests", # packaged skill tests
]
