plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace = "dev.adaos.androidnode"
    compileSdk = 37

    defaultConfig {
        applicationId = "dev.adaos.androidnode"
        minSdk = 26
        targetSdk = 36
        versionCode = 2
        versionName = "0.1.0-poc2"

        ndk {
            abiFilters.add("arm64-v8a")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        if (System.getProperty("os.name").toLowerCase().contains("windows")) {
            buildPython("py", "-3.11")
        } else {
            buildPython("python3.11")
        }
        pip {
            install("../wheels/y_py-0.6.2+adaos.1-cp311-cp311-android_26_arm64_v8a.whl")
        }
        pyc {
            src = false
        }
    }
}
