plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

def portableRasaPython = layout.buildDirectory.dir("generated/portable-rasa-python")

tasks.register("syncPortableRasaRuntime", Copy) {
    from(file("../../../services/nlu/portable_rasa.py"))
    into(portableRasaPython.map { it.dir("adaos/services/nlu") })
}

android {
    namespace = "dev.adaos.androidnode"
    compileSdk = 36

    defaultConfig {
        applicationId = "dev.adaos.androidnode"
        minSdk = 26
        targetSdk = 36
        versionCode = 13
        versionName = "0.1.0-poc13"

        ndk {
            abiFilters.add("arm64-v8a")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        main {
            python.srcDir(portableRasaPython)
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("syncPortableRasaRuntime"))
}

tasks.matching { it.name.startsWith("merge") && it.name.endsWith("PythonSources") }.configureEach {
    dependsOn(tasks.named("syncPortableRasaRuntime"))
}

chaquopy {
    defaultConfig {
        version = "3.11"
        if (System.getProperty("os.name").toLowerCase().contains("windows")) {
            buildPython("py", "-3.11")
        } else {
            buildPython("python3.11")
        }
        pip {
            install("../wheels/y_py-0.6.2+adaos.1-cp311-cp311-android_26_arm64_v8a.whl")
        }
        pyc {
            src = false
        }
    }
}
