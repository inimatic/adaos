plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

def portableRasaPython = layout.buildDirectory.dir("generated/portable-rasa-python")
def adaosAndroidAbi = (project.findProperty("adaosAndroidAbi") ?: "arm64-v8a").toString()
def adaosVoskMirrorBase = (project.findProperty("adaosVoskMirrorBase") ?: "").toString().trim().replaceAll('/+$', '')
def buildConfigString = { value ->
    '"' + value.toString().replace("\\", "\\\\").replace("\"", "\\\"") + '"'
}
def adaosYPyWheelByAbi = [
    "arm64-v8a"  : "../wheels/y_py-0.6.2+adaos.1-cp311-cp311-android_26_arm64_v8a.whl",
    "armeabi-v7a": "../wheels/y_py-0.6.2+adaos.1-cp311-cp311-android_26_armeabi_v7a.whl",
]
def adaosYPyWheel = adaosYPyWheelByAbi[adaosAndroidAbi]
if (adaosYPyWheel == null) {
    throw new GradleException("Unsupported adaosAndroidAbi=${adaosAndroidAbi}; expected one of ${adaosYPyWheelByAbi.keySet()}")
}

tasks.register("syncPortableRasaRuntime", Copy) {
    into(portableRasaPython)
    into("adaos/services/nlu") {
        from(file("../../../services/nlu/portable_rasa.py"))
    }
    into("adaos/adapters/audio/stt") {
        from(file("../../../adapters/audio/stt/model_manager.py"))
    }
}

android {
    namespace = "dev.adaos.androidnode"
    compileSdk = 36

    defaultConfig {
        applicationId = "dev.adaos.androidnode"
        minSdk = 26
        targetSdk = 36
        versionCode = 21
        versionName = "0.1.0-poc21"
        buildConfigField("String", "VOSK_MODEL_MIRROR_BASE", buildConfigString(adaosVoskMirrorBase))

        ndk {
            abiFilters.add(adaosAndroidAbi)
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        main {
            python.srcDir(portableRasaPython)
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("syncPortableRasaRuntime"))
}

tasks.matching { it.name.startsWith("merge") && it.name.endsWith("PythonSources") }.configureEach {
    dependsOn(tasks.named("syncPortableRasaRuntime"))
}

chaquopy {
    defaultConfig {
        version = "3.11"
        if (System.getProperty("os.name").toLowerCase().contains("windows")) {
            buildPython("py", "-3.11")
        } else {
            buildPython("python3.11")
        }
        pip {
            install(adaosYPyWheel)
        }
        pyc {
            src = false
        }
    }
}

dependencies {
    implementation "com.alphacephei:vosk-android:0.3.75@aar"
    implementation "net.java.dev.jna:jna:5.18.1@aar"
}
