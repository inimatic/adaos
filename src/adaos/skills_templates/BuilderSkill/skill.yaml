name: builder_skill
version: "0.1.0"
description: "Rapid prototyping Builder skill for creating and editing scenario UI drafts from voice or text dialog."
entry: "handlers/main.py"
runtime:
  python: "3.11"
default_tool: "chat"
dependencies: []
events:
  subscribe: []
  publish:
    - io.out.chat.append
exports:
  tools:
    - start
    - chat
    - create_scenario_draft
    - update_current_scenario
    - get_session
    - get_preview_state
tools:
  - name: start
    description: "Start or resume the Builder rapid prototyping dialog."
    entry: "handlers.main:start"
    input_schema:
      type: object
      properties:
        text:
          type: string
        webspace_id:
          type: string
      additionalProperties: true
    output_schema:
      type: object
      required: [ok, message, dialog]
  - name: chat
    description: "Handle a Builder dialog turn and create or patch a scenario prototype."
    entry: "handlers.main:chat"
    input_schema:
      type: object
      properties:
        text:
          type: string
        webspace_id:
          type: string
        auto_apply:
          type: boolean
      additionalProperties: true
    output_schema:
      type: object
      required: [ok, message, dialog]
  - name: create_scenario_draft
    description: "Create a new dev-space scenario draft with a declarative web UI prototype."
    entry: "handlers.main:create_scenario_draft"
    input_schema:
      type: object
      required: [idea]
      properties:
        idea:
          type: string
        scenario_id:
          type: string
        webspace_id:
          type: string
      additionalProperties: true
    output_schema:
      type: object
      required: [ok, session_id, scenario_id]
  - name: update_current_scenario
    description: "Apply a safe declarative UI patch to the current Builder scenario session."
    entry: "handlers.main:update_current_scenario"
    input_schema:
      type: object
      required: [instruction]
      properties:
        instruction:
          type: string
        webspace_id:
          type: string
      additionalProperties: true
    output_schema:
      type: object
      required: [ok, message]
  - name: get_session
    description: "Return the current Builder rapid prototyping session."
    entry: "handlers.main:get_session"
    input_schema:
      type: object
      properties:
        session_id:
          type: string
        webspace_id:
          type: string
      additionalProperties: true
    output_schema:
      type: object
      required: [ok]
  - name: get_preview_state
    description: "Return the render-ready declarative preview state for the current Builder session."
    entry: "handlers.main:get_preview_state"
    input_schema:
      type: object
      properties:
        session_id:
          type: string
        webspace_id:
          type: string
      additionalProperties: true
    output_schema:
      type: object
      required: [ok, preview_state]
data_routes:
  - surface: "builder rapid prototype preview"
    route: "skill-local"
    path: "skill_memory:builder_skill.sessions"
    owner: "skill:builder_skill"
    first_paint: "empty Builder session with a prompt to describe the application"
    recovery: "get_preview_state rebuilds preview from skill-local session and dev scenario files"
    guard_visibility: "Builder reports degraded preview state in tool response"
llm_hints:
  description: "Builder rapid prototyping agent. Use when the user asks Builder/Строитель to create or change an application, scenario, form, list, table, card view, or web UI prototype."
  aliases:
    - "Builder"
    - "builder"
    - "buikder"
    - "Строитель"
    - "строитель"
    - "билдер"
  side_effect_class: "local_write"
  primary_actions:
    - id: builder.start
      intent: builder.start
      tool: start
      side_effect_class: local_write
      examples:
        - "Строитель, создадим приложение список покупок"
        - "Builder, create a shopping list app"
    - id: builder.chat
      intent: builder.chat
      tool: chat
      side_effect_class: local_write
      examples:
        - "добавь поле цена"
        - "покажи список карточками"
nlu_hints:
  aliases:
    - "Строитель"
    - "Builder"
    - "билдер"
  examples:
    - text: "Строитель, создадим приложение список покупок"
      locale: "ru"
      intent: builder.start
    - text: "Builder, create a shopping list app"
      locale: "en"
      intent: builder.start
conversation:
  dialog_channel:
    id: builder
    label: Builder
    owner: skill:builder_skill
    default_tool: builder_skill.chat
  agents:
    - id: agent:builder_skill:builder
      label: "Строитель"
      owner: skill:builder_skill
      kind: skill_agent
      channel_id: builder
      skill: builder_skill
      talk_tool: chat
      gender: male
      voice: ru-male
      icon: construct-outline
      aliases:
        - "Строитель"
        - "строитель"
        - "Builder"
        - "builder"
        - "buikder"
        - "билдер"
