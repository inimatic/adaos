name: "new_skill"
version: "0.1.0"
description: "Research direction package: governed experimental code and domain-owned primary data."
supported_locales: ["en", "ru"]
entry: "handlers/main.py"
default_tool: "describe_direction"

runtime:
  python: "3.11"

dependencies: []
events:
  subscribe: []
  publish: []
provider_contracts:
  - contract: "adaos.research.runner.v1"
    capability: "research.runner"
    operations:
      - prepare_attempt
      - collect_attempt
      - verify_artifact
      - dataset_status
exports:
  tools:
    - describe_direction
    - validate_research_prototype
    - execution_readiness
    - prepare_attempt
    - collect_attempt
    - verify_artifact
    - dataset_status
tools:
  - name: describe_direction
    description: "Return the typed research-direction descriptor and current implementation readiness."
    entry: "handlers.main:describe_direction"
    input_schema:
      type: object
      additionalProperties: true
    output_schema:
      type: object
      required: [ok, direction, readiness]
  - name: validate_research_prototype
    description: "Run domain-specific checks over a candidate ResearchPrototype without accepting it."
    entry: "handlers.main:validate_research_prototype"
    input_schema:
      type: object
      required: [prototype]
      properties:
        prototype: {type: object}
      additionalProperties: true
    output_schema:
      type: object
      required: [ok, accepted, issues]
  - name: execution_readiness
    description: "Report whether Codex has implemented the experimental runner contract."
    entry: "handlers.main:execution_readiness"
    input_schema:
      type: object
      additionalProperties: true
    output_schema:
      type: object
      required: [ok, ready, missing]
  - name: prepare_attempt
    description: "Prepare an executable attempt package without starting scientific execution. Pre-Codex stub fails closed."
    entry: "handlers.main:prepare_attempt"
    side_effects: local_write
    input_schema:
      type: object
      required: [request]
      properties:
        request: {type: object}
      additionalProperties: false
    output_schema: {type: object}
  - name: collect_attempt
    description: "Collect normalized observations and portable content references. Pre-Codex stub fails closed."
    entry: "handlers.main:collect_attempt"
    side_effects: read_only
    input_schema:
      type: object
      required: [output_ref]
      properties:
        output_ref: {type: string, minLength: 1}
      additionalProperties: false
    output_schema: {type: object}
  - name: verify_artifact
    description: "Verify a content-addressed artifact owned by this direction. Pre-Codex stub fails closed."
    entry: "handlers.main:verify_artifact"
    side_effects: read_only
    input_schema:
      type: object
      required: [uri, digest]
      properties:
        uri: {type: string, minLength: 1}
        digest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
      additionalProperties: false
    output_schema: {type: object}
  - name: dataset_status
    description: "Report immutable validation, robustness and sealed-test identities. Pre-Codex stub reports not ready."
    entry: "handlers.main:dataset_status"
    side_effects: read_only
    input_schema:
      type: object
      additionalProperties: false
    output_schema: {type: object}

research_direction:
  schema: "adaos.research.direction.v1"
  schema_version: "1.0.0"
  owner: "skill:new_skill"
  descriptor: "research.yaml"
  primary_data_owner: "skill:new_skill"
  runner_contract: "adaos.research.runner.v1"
  pre_codex: true

presentations:
  - id: research-workbench
    scenario: research_workbench
    contract: adaos.research.direction.v1
    default: true
    bindings:
      direction_ref: skill:self

llm_hints:
  description: "Research direction owned by new_skill. The shared research orchestrator governs intake and formulation."
  aliases: ["research direction"]
  primary_actions:
    - id: new_skill.describe_direction
      intent: new_skill.describe_direction
      tool: describe_direction
      side_effect_class: read_only
      examples:
        - "Describe this research direction"
        - "What remains before this research can run?"
  examples: []
  owner_hints: ["skill:new_skill"]

nlu_hints:
  aliases: ["research direction"]
  examples: []
  slot_schemas: {}
  entities: []
